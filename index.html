<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기능해부학 용어 스터디</title>
<style>
  :root{
    --ink:#0b1c2c; --ink-2:#14344a; --accent:#4fb3d9; --accent-deep:#2d7ea3;
    --muscle:#b5453d; --muscle-soft:#f3ded9;
    --paper:#eef1f4; --card:#ffffff; --line:#dbe1e7;
    --text:#152230; --text-soft:#5b6b78;
    --good:#2f8f5b; --good-soft:#e3f3ea;
    --bad:#c0463d; --bad-soft:#fbe6e3;
    --warn:#a5761f; --warn-soft:#fbf1da;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header.top{
    background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 65%,var(--accent-deep) 130%);
    color:#fff; padding:22px 20px 18px; position:relative; overflow:hidden;
  }
  header.top::after{
    content:""; position:absolute; right:-40px; top:-30px; width:150px; height:150px;
    border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%); opacity:.55;
  }
  header.top h1{ margin:0; font-size:21px; font-weight:800; letter-spacing:-0.2px; position:relative; }
  header.top p{ margin:6px 0 0; font-size:13px; color:#c8dae6; position:relative; }
  .level-row{ display:flex; gap:6px; margin-top:14px; position:relative; }
  .level-btn{
    flex:1; text-align:center; padding:8px 4px; border-radius:10px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#dce8ef; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .level-btn.active{ background:#fff; color:var(--ink); border-color:#fff; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .stat-card{ background:var(--card); border-radius:var(--radius); padding:14px 10px; text-align:center; border:1px solid var(--line); }
  .stat-card .num{ font-size:22px; font-weight:800; color:var(--ink); }
  .stat-card .label{ font-size:11.5px; color:var(--text-soft); margin-top:2px; }
  .section-title{ font-size:14px; font-weight:700; color:var(--text-soft); margin:22px 0 10px 2px; }
  .level-note{
    font-size:12px; color:var(--text-soft); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; line-height:1.5;
  }
  main{ flex:1; padding:18px 16px 90px; }

  .acc-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .acc-row{ margin-bottom:12px; }
  .acc-row:last-child{ margin-bottom:0; }
  .acc-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:5px; }
  .acc-head .pname{ font-weight:700; }
  .acc-head .pval{ font-variant-numeric:tabular-nums; font-weight:800; }
  .acc-head .pval.none{ color:var(--text-soft); font-weight:600; font-size:12px; }
  .acc-track{ height:7px; background:var(--line); border-radius:99px; overflow:hidden; }
  .acc-fill{ height:100%; border-radius:99px; }
  .acc-sub{ font-size:11px; color:var(--text-soft); margin-top:3px; }

  .menu-item{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:transform .12s ease;
  }
  .menu-item:active{ transform:scale(.98); }
  .menu-item .ic{ width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:18px;flex-shrink:0; }
  .menu-item .body h3{ margin:0; font-size:15px; font-weight:700; }
  .menu-item .body p{ margin:2px 0 0; font-size:12.5px; color:var(--text-soft); }
  .menu-item .chev{ margin-left:auto; color:var(--text-soft); font-size:16px; }
  .ic.blue{ background:#e2f1f8; color:var(--accent-deep); }
  .ic.red{ background:var(--bad-soft); color:var(--bad); }
  .ic.gold{ background:var(--warn-soft); color:var(--warn); }
  .ic.green{ background:var(--good-soft); color:var(--good); }

  nav.bottom{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; color:var(--text-soft); padding:6px 2px; cursor:pointer; font-family:inherit;
  }
  nav.bottom button .emoji{ font-size:18px; }
  nav.bottom button.active{ color:var(--accent-deep); font-weight:700; }

  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    background:var(--card); border:1px solid var(--line); width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:16px; color:var(--ink); flex-shrink:0;
  }
  .top-bar h2{ font-size:16px; margin:0; font-weight:800; }

  .choice-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .choice-btn{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; text-align:left; font-size:14px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .choice-btn.selected{ border-color:var(--accent-deep); background:#eaf5fa; }
  .choice-btn.correct{ border-color:var(--good); background:var(--good-soft); font-weight:700; }
  .choice-btn.wrong{ border-color:var(--bad); background:var(--bad-soft); font-weight:700; }
  .primary-btn{
    width:100%; background:var(--ink); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:18px; font-family:inherit;
  }
  .primary-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .secondary-btn{
    width:100%; background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; font-family:inherit;
  }
  .part-chip{
    display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; margin:0 8px 8px 0; cursor:pointer;
  }
  .part-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .quiz-progress{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-soft); margin-bottom:8px; }
  .quiz-timer{ font-weight:800; color:var(--muscle); font-variant-numeric:tabular-nums; }
  .progress-track{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:var(--accent-deep); border-radius:99px; }

  .q-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px; }
  .q-part-tag{ display:inline-block; font-size:11px; font-weight:700; color:var(--accent-deep); background:#e2f1f8; padding:3px 9px; border-radius:6px; margin-bottom:8px; margin-right:6px; }
  .q-level-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; margin-bottom:8px; margin-right:6px; }
  .q-level-tag.ko{ color:var(--good); background:var(--good-soft); }
  .q-level-tag.mid{ color:var(--warn); background:var(--warn-soft); }
  .q-level-tag.en{ color:var(--bad); background:var(--bad-soft); }
  .q-streak-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; margin-bottom:8px; color:var(--warn); background:var(--warn-soft); }
  .q-text{ font-size:16px; font-weight:700; line-height:1.5; margin:0 0 4px; }
  .explain-box{ margin-top:14px; padding:12px 14px; background:var(--muscle-soft); border-radius:10px; font-size:13.5px; line-height:1.5; color:#5a2c26; }
  .explain-box b{ color:var(--muscle); }
  .star-btn{ background:none; border:none; font-size:20px; cursor:pointer; padding:2px 6px; }

  .result-hero{ text-align:center; padding:28px 10px 10px; }
  .result-score{ font-size:44px; font-weight:900; color:var(--ink); }
  .result-sub{ font-size:13.5px; color:var(--text-soft); margin-top:4px; }
  .pass-badge{ display:inline-block; margin-top:12px; padding:6px 16px; border-radius:999px; font-size:13px; font-weight:700; }
  .pass-badge.pass{ background:var(--good-soft); color:var(--good); }
  .pass-badge.fail{ background:var(--bad-soft); color:var(--bad); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-soft); }
  .empty-state .emoji{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; line-height:1.6; margin:4px 0; }

  .review-row{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .review-row .count-badge{ background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; flex-shrink:0; }
  .review-row .rq{ font-size:13.5px; flex:1; }
  .review-row .streak{ font-size:11px; color:var(--text-soft); flex-shrink:0; }

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
    max-width:90%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; bottom:88px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>해부학 용어 스터디</h1>
    <p>기능해부학 · 매주 배운 용어 누적</p>
    <div class="level-row" id="levelRow"></div>
    <div class="stat-row" id="statRow"></div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="bottomNav">
    <button data-tab="home"><span class="emoji">🏠</span>홈</button>
    <button data-tab="part"><span class="emoji">📚</span>파트별</button>
    <button data-tab="exam"><span class="emoji">⏱️</span>모의고사</button>
    <button data-tab="wrong"><span class="emoji">📝</span>오답노트</button>
    <button data-tab="fav"><span class="emoji">⭐</span>즐겨찾기</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 문제 데이터 =================
   ko: 한글 질문 + 한글/영어 병기 선택지
   en: 영어 질문 + 영어 전용 선택지
   난이도 '중' = ko 질문 + en 선택지
   a: 정답 인덱스 (ko/en 선택지 순서는 동일하게 맞춰 작성)
================================================ */
const QUESTIONS = [
  {id:"q01", part:"자세·방향",
   ko:{q:"해부학적 자세에서 손바닥은 어느 방향을 향하는가?", opts:["앞(anterior)","뒤(posterior)","안쪽(medial)","위(superior)"]},
   en:{q:"In the anatomical position, which direction do the palms face?", opts:["Anterior","Posterior","Medial","Superior"]},
   a:0, ex:"해부학적 자세는 양발을 모으고 정면을 향한 채, 양팔은 몸에 붙이고 손바닥이 앞을 향하는 기준 자세입니다."},
  {id:"q02", part:"자세·방향",
   ko:{q:"정중선(인체 가운데 선)에 가까워지는 쪽을 가리키는 용어는?", opts:["외측(lateral)","내측(medial)","근위(proximal)","원위(distal)"]},
   en:{q:"Which term refers to the side that moves closer to the midline of the body?", opts:["Lateral","Medial","Proximal","Distal"]},
   a:1, ex:"내측(medial)은 정중선을 향하는 쪽, 외측(lateral)은 정중선에서 멀어지는 쪽입니다."},
  {id:"q03", part:"자세·방향",
   ko:{q:"복장뼈(흉골)와 심장의 위치 관계에서, 심장은 흉골에 대해 어디에 해당하는가?", opts:["anterior(전)","posterior(후)","superior(상)","distal(원위)"]},
   en:{q:"Regarding the position of the sternum and the heart, where is the heart relative to the sternum?", opts:["Anterior","Posterior","Superior","Distal"]},
   a:1, ex:"흉골(복장뼈)이 anterior, 그 뒤에 있는 심장이 posterior에 해당하는 대표적인 예시입니다."},
  {id:"q04", part:"자세·방향",
   ko:{q:"\"팔꿈치는 어깨보다 ___ 이다\" 빈칸에 들어갈 용어는?", opts:["superior(상)","inferior(하)","medial(내측)","proximal(근위)"]},
   en:{q:"\"The elbow is ___ to the shoulder.\" Which term fits the blank?", opts:["Superior","Inferior","Medial","Proximal"]},
   a:1, ex:"어깨보다 머리 쪽에서 멀어지는 팔꿈치는 inferior(하)에 해당합니다."},
  {id:"q05", part:"자세·방향",
   ko:{q:"팔꿈치는 손목보다 어느 쪽에 해당하는가? (사지에서 주로 쓰이는 용어)", opts:["distal(원위)","proximal(근위)","lateral(외측)","superficial(외)"]},
   en:{q:"The elbow is which of the following relative to the wrist? (a term mainly used for limbs)", opts:["Distal","Proximal","Lateral","Superficial"]},
   a:1, ex:"몸통에 더 가까운 팔꿈치가 proximal(근위), 손목은 팔꿈치보다 distal(원위)입니다."},
  {id:"q06", part:"자세·방향",
   ko:{q:"체표면에 가까이 위치하는 쪽을 가리키는 용어는?", opts:["deep(내)","superficial(외)","inferior(하)","distal(원위)"]},
   en:{q:"Which term refers to the side located close to the body surface?", opts:["Deep","Superficial","Inferior","Distal"]},
   a:1, ex:"superficial(외/표층)은 체표면에 가까운 쪽, deep(내/심층)은 체표면보다 더 아래에 위치한 쪽입니다."},

  {id:"q07", part:"면·축",
   ko:{q:"시상면(sagittal plane)은 신체를 어떻게 나누는가?", opts:["좌우(left and right)","전후(front and back)","상하(upper and lower)","내외(inner and outer)"]},
   en:{q:"The sagittal plane divides the body into which parts?", opts:["Left and right parts","Front and back parts","Upper and lower parts","Inner and outer parts"]},
   a:0, ex:"시상면(sagittal plane)은 신체를 좌,우로 나누는 가상의 면입니다."},
  {id:"q08", part:"면·축",
   ko:{q:"관상면(coronal plane)은 신체를 어떻게 나누는가?", opts:["좌, 우로 나눈다","앞, 뒤로 나눈다","상, 하로 나눈다","안, 밖으로 나눈다"]},
   en:{q:"The coronal plane divides the body into which parts?", opts:["Left and right parts","Front and back parts","Upper and lower parts","Inner and outer parts"]},
   a:1, ex:"관상면은 신체를 앞(전)과 뒤(후)로 나누는 가상의 면입니다."},
  {id:"q09", part:"면·축",
   ko:{q:"수평면(horizontal plane)은 신체를 어떻게 나누는가?", opts:["앞, 뒤로 나눈다","좌, 우로 나눈다","상, 하로 나눈다","근위, 원위로 나눈다"]},
   en:{q:"The horizontal plane divides the body into which parts?", opts:["Front and back parts","Left and right parts","Upper and lower parts","Proximal and distal parts"]},
   a:2, ex:"수평면은 신체를 상(위)과 하(아래)로 나누는 가상의 면입니다."},
  {id:"q10", part:"면·축",
   ko:{q:"시상면에서 일어나는 움직임(예: 팔꿈치 굽히기)의 회전축은 무엇인가?", opts:["시상축","관상축","수직축","종축"]},
   en:{q:"What is the axis of rotation for a movement occurring in the sagittal plane (e.g. elbow flexion)?", opts:["Sagittal axis","Coronal axis","Vertical axis","Longitudinal axis"]},
   a:1, ex:"움직임이 일어나는 면과 회전축은 서로 수직입니다. 시상면에서 일어나는 움직임의 회전축은 시상면을 꿰뚫는 관상축입니다."},
  {id:"q11", part:"면·축",
   ko:{q:"관상축(coronal axis)은 어떤 면을 꿰뚫는 축인가?", opts:["관상면","시상면","수평면","정중면"]},
   en:{q:"Which plane does the coronal axis pass through?", opts:["Coronal plane","Sagittal plane","Horizontal plane","Median plane"]},
   a:1, ex:"관상축은 두개골의 관상봉합과 평행한 방향의 축으로, 시상면을 꿰뚫는 축을 의미합니다."},
  {id:"q12", part:"면·축",
   ko:{q:"수직축(vertical axis)은 어떤 면을 꿰뚫는 축인가?", opts:["시상면","관상면","수평면","정중면"]},
   en:{q:"Which plane does the vertical axis pass through?", opts:["Sagittal plane","Coronal plane","Horizontal plane","Median plane"]},
   a:2, ex:"수직축은 중심선과 평행을 이루는 축으로, 수평면을 꿰뚫는 축을 의미합니다."},

  {id:"q13", part:"관절 움직임",
   ko:{q:"두 뼈 사이의 각을 좁히는 움직임을 가리키는 용어는?", opts:["신전(extension)","굴곡(flexion)","외전(abduction)","회전(rotation)"]},
   en:{q:"Which term refers to a movement that decreases the angle between two bones?", opts:["Extension","Flexion","Abduction","Rotation"]},
   a:1, ex:"굽힘/굴곡(flexion)은 두 뼈 사이의 각을 좁히는 움직임이고, 폄/신전(extension)은 그 각을 넓히는 움직임입니다."},
  {id:"q14", part:"관절 움직임",
   ko:{q:"인체의 정중선에서 멀어지는 움직임을 가리키는 용어는?", opts:["내전(adduction)","외전(abduction)","회선(circumduction)","회전(rotation)"]},
   en:{q:"Which term refers to a movement that moves away from the midline of the body?", opts:["Adduction","Abduction","Circumduction","Rotation"]},
   a:1, ex:"ab-는 '멀어지다'라는 뜻의 접두사로, 벌림/외전(abduction)은 정중선에서 멀어지는 움직임입니다. 반대로 ad-(내전)는 정중선에 가까워지는 움직임입니다."},
  {id:"q15", part:"관절 움직임",
   ko:{q:"손목과 팔을 내측면으로 돌려 손등이 위를 향하게 하는 동작은?", opts:["뒤침/회외(supination)","엎침/회내(pronation)","회선(circumduction)","외번(eversion)"]},
   en:{q:"Which movement rotates the wrist and arm medially so that the back of the hand faces upward?", opts:["Supination","Pronation","Circumduction","Eversion"]},
   a:1, ex:"엎침/회내(pronation)는 손등이 위로 향하는 동작, 뒤침/회외(supination)는 손바닥이 위로 향하는 동작입니다."},
  {id:"q16", part:"관절 움직임",

function displayOf(q, level){

  if(level==="mid") return {qText:q.ko.q, opts:q.en.opts};
  return {qText:q.en.q, opts:q.en.opts};
}

/* ================= 저장소 =================
   attempts[qid] = { ko:{wrong,correct,streak}, mid:{...}, en:{...} }
   난이도(하/중/상)별로 기록을 분리 보관한다 — '하'에서 쌓은 정답률이 '중/상'에 섞이지 않는다.
   SCHEMA_VERSION을 올리고 migrate()에 변환 규칙을 추가하면,
   이후 구조가 바뀌어도 기존 저장 데이터를 지우지 않고 이어서 쓸 수 있다. */
const STORE_KEY = "anat_progress"; // 이 키는 앞으로 바꾸지 않는다 — 구조 변경은 migrate()로 흡수
const SCHEMA_VERSION = 2;
const DEFAULTS = { attempts:{}, favorites:[], todayDate:"", todayCount:0, level:"ko", schemaVersion:SCHEMA_VERSION };
let progress = JSON.parse(JSON.stringify(DEFAULTS));

function emptyLevelRec(){ return {wrong:0, correct:0, streak:0}; }

/* 예전 버전 데이터를 최신 구조로 변환한다. 모르는 필드는 버리지 않고 최대한 옮겨 담는다. */
function migrate(data){
  const fromVersion = data.schemaVersion || 1;
  if(fromVersion < 2){
    // v1: attempts[qid] = {wrong, correct, streak} (난이도 구분 없이 하나로 기록됨)
    // → 기존 기록은 '하' 난이도에서 쌓인 것으로 간주해 ko 버킷으로 이전한다.
    const migratedAttempts = {};
    Object.keys(data.attempts || {}).forEach(qid=>{
      const old = data.attempts[qid];
      if(old && (old.ko || old.mid || old.en)){
        migratedAttempts[qid] = { ko: old.ko||emptyLevelRec(), mid: old.mid||emptyLevelRec(), en: old.en||emptyLevelRec() };
      } else if(old){
        migratedAttempts[qid] = {
          ko: {wrong: old.wrong||0, correct: old.correct||0, streak: old.streak||0},
          mid: emptyLevelRec(), en: emptyLevelRec(),
        };
      }
    });
    data.attempts = migratedAttempts;
  }
  data.schemaVersion = SCHEMA_VERSION;
  return data;
}

/* GitHub Pages 등 일반 웹 호스팅에서 동작하도록 localStorage를 사용한다.
   기기(브라우저) 단위로 개인 기록이 저장되며, 계정 간 동기화는 되지 않는다. */
async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = migrate(JSON.parse(raw));
      progress = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), parsed);
    }
  }catch(e){ /* 최초 사용 또는 localStorage 접근 불가: 저장된 값 없음 */ }
  const today = new Date().toISOString().slice(0,10);
  if(progress.todayDate !== today){ progress.todayDate = today; progress.todayCount = 0; }
}
async function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error("저장 실패", e); }
}

function rec(qid, level){
  if(!progress.attempts[qid]) progress.attempts[qid] = { ko:emptyLevelRec(), mid:emptyLevelRec(), en:emptyLevelRec() };
  if(!progress.attempts[qid][level]) progress.attempts[qid][level] = emptyLevelRec();
  return progress.attempts[qid][level];
}
function markAttempt(qid, correct){
  const r = rec(qid, progress.level);
  if(correct){ r.correct++; r.streak++; }
  else { r.wrong++; r.streak = 0; }
  progress.todayCount++;
}
function toggleFavorite(qid){
  const i = progress.favorites.indexOf(qid);
  if(i>-1) progress.favorites.splice(i,1); else progress.favorites.push(qid);
}
/* 현재 선택된 난이도 기준으로, 한 번이라도 틀렸고 아직 연속 정답 2회를 못 채운 문항만 오답노트에 남는다 */
function wrongIds(level){
  level = level || progress.level;
  return Object.keys(progress.attempts).filter(id=>{
    const byLevel = progress.attempts[id];
    const r = byLevel && byLevel[level];
    if(!r || r.wrong === 0) return false;
    return (r.streak || 0) < GRADUATE_STREAK;
  });
}
/* 현재 선택된 난이도 기준의 파트별 정답률 */
function partStats(level){
  level = level || progress.level;
  return PARTS.map(p=>{
    const qs = QUESTIONS.filter(q=>q.part===p);
    let c=0, w=0;
    qs.forEach(q=>{
      const byLevel = progress.attempts[q.id];
      const r = byLevel && byLevel[level];
      if(r){ c+=r.correct; w+=r.wrong; }
    });
    const total = c+w;
    return { part:p, correct:c, wrong:w, total, pct: total? Math.round(c/total*100) : null };
  });
}
function accColor(pct){
  if(pct===null) return "var(--line)";
  if(pct>=80) return "var(--good)";
  if(pct>=60) return "var(--warn)";
  return "var(--bad)";
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function byIds(ids){ return QUESTIONS.filter(q=>ids.includes(q.id)); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

    const row = document.createElement('div');
    row.className = 'review-row';
    row.innerHTML = `<span class="count-badge" style="background:var(--good-soft);color:var(--good);">${q.part}</span><span class="rq">${displayOf(q, progress.level).qText}</span>`;
    wrap.appendChild(row);
  });
  main.appendChild(wrap);
  const btn = document.createElement('button');
  btn.className = 'primary-btn';
  btn.textContent = '즐겨찾기 문항 풀기';
  btn.onclick = ()=> startQuiz(shuffle(list), {title:"즐겨찾기", mode:"practice"});
  main.appendChild(btn);
}

/* ================= 퀴즈 엔진 ================= */
let quizState = null;

function startQuiz(list, opts){
  if(list.length===0){ showToast("풀 수 있는 문항이 없습니다."); return; }
  // 문항마다 선택지 순서를 섞은 인덱스 배열을 미리 만들어 둔다(같은 문항 내에서는 고정)
  const orders = {};
  list.forEach(q=>{ orders[q.id] = shuffle([0,1,2,3].slice(0, q.ko.opts.length)); });

  quizState = {
    list, orders, idx:0, answers:{},
    mode: opts.mode || "practice",
    title: opts.title || "문제 풀이",
    timeLimit: opts.timeLimit || null,
    remaining: opts.timeLimit || null,
    timer: null,
  };
  if(quizState.timeLimit){
    quizState.timer = setInterval(()=>{
      quizState.remaining--;
      const t = document.getElementById('qTimer');
      if(t) t.textContent = fmtTime(quizState.remaining);
      if(quizState.remaining<=0){ clearInterval(quizState.timer); submitExam(); }
    },1000);
  }
  renderQuiz();
}
function fmtTime(s){
  const m=Math.floor(s/60), sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderQuiz(){
  const {list, idx, mode, title, orders} = quizState;
  const q = list[idx];
  const level = progress.level;
  const {qText, opts} = displayOf(q, level);
  const order = orders[q.id];              // 화면 위치 → 원본 선택지 인덱스
  const isFav = progress.favorites.includes(q.id);
  const chosen = quizState.answers[q.id];  // 원본 인덱스로 저장
  const answered = chosen !== undefined;
  const r = progress.attempts[q.id] && progress.attempts[q.id][level];
  const inWrongNote = r && r.wrong>0 && (r.streak||0) < GRADUATE_STREAK;

  main.innerHTML = `
    <div class="top-bar">
      <div class="back-btn" id="quitBtn">✕</div>
      <h2>${title}</h2>
      ${quizState.timeLimit ? `<span class="quiz-timer" id="qTimer" style="margin-left:auto;">${fmtTime(quizState.remaining)}</span>` : ''}
    </div>
    <div class="quiz-progress"><span>${idx+1} / ${list.length}</span><span>${q.part}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${((idx+1)/list.length*100).toFixed(0)}%"></div></div>
    <div class="q-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div>
          <span class="q-part-tag">${q.part}</span>
          <span class="q-level-tag ${level}">${LEVELS.find(l=>l.id===level).label}</span>
          ${inWrongNote ? `<span class="q-streak-tag">연속 ${r.streak||0}/${GRADUATE_STREAK}</span>` : ``}
        </div>
        <button class="star-btn" id="favBtn">${isFav ? '⭐' : '☆'}</button>
      </div>
      <p class="q-text">${qText}</p>
      <div class="choice-list" id="choiceList"></div>
      <div id="explainWrap"></div>
    </div>
  `;
  document.getElementById('quitBtn').onclick = ()=>{
    if(quizState.timer) clearInterval(quizState.timer);
    currentTab="home"; render();
  };
  document.getElementById('favBtn').onclick = ()=>{ toggleFavorite(q.id); saveProgress(); renderQuiz(); };

  const cl = document.getElementById('choiceList');
  order.forEach(origIdx=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = opts[origIdx];
    if(mode==="practice" && answered){
      if(origIdx===q.a) b.classList.add('correct');
      else if(origIdx===chosen) b.classList.add('wrong');
    } else if(mode==="exam" && chosen===origIdx){
      b.classList.add('selected');
    }
    b.onclick = ()=> selectAnswer(origIdx);
    cl.appendChild(b);
  });

  if(mode==="practice" && answered){
    const ok = chosen===q.a;
    const rr = progress.attempts[q.id][level];
    const streakMsg = ok
      ? ((rr.streak||0) >= GRADUATE_STREAK
          ? `연속 ${GRADUATE_STREAK}회 정답 — 오답노트에서 졸업했습니다.`
          : (rr.wrong>0 ? `연속 정답 ${rr.streak}/${GRADUATE_STREAK} — 한 번 더 맞히면 오답노트에서 사라집니다.` : ``))
      : `연속 정답 기록이 0으로 초기화됐습니다.`;
    document.getElementById('explainWrap').innerHTML = `
      <div class="explain-box"><b>해설</b><br>${q.ex}${streakMsg ? `<br><br>${streakMsg}` : ``}</div>`;
  }
  renderQuizFooter();
}

function selectAnswer(origIdx){
  const q = quizState.list[quizState.idx];
  if(quizState.mode==="practice" && quizState.answers[q.id]!==undefined) return;
  quizState.answers[q.id] = origIdx;
  if(quizState.mode==="practice"){
    markAttempt(q.id, origIdx===q.a);
    saveProgress();
  }
  renderQuiz();
}

function renderQuizFooter(){
  const {list, idx, mode} = quizState;
  const q = list[idx];
  const answered = quizState.answers[q.id] !== undefined;
  const footer = document.createElement('div');
  footer.style.display='flex'; footer.style.gap='8px'; footer.style.marginTop='4px';

  if(mode==="exam"){
    const prev = document.createElement('button');
    prev.className='secondary-btn'; prev.style.flex='1'; prev.textContent='이전';
    prev.disabled = idx===0;
    prev.onclick = ()=>{ quizState.idx--; renderQuiz(); };
    footer.appendChild(prev);

    const next = document.createElement('button');
    next.className='primary-btn'; next.style.flex='1'; next.style.marginTop='0';
    next.textContent = idx===list.length-1 ? '제출' : '다음';
    next.onclick = ()=>{ if(idx===list.length-1) submitExam(); else { quizState.idx++; renderQuiz(); } };
    footer.appendChild(next);
  } else {
    const next = document.createElement('button');
    next.className='primary-btn'; next.style.flex='1';
    next.disabled = !answered;
    next.textContent = idx===list.length-1 ? '결과 보기' : '다음 문제';
    next.onclick = ()=>{ if(idx===list.length-1) finishPractice(); else { quizState.idx++; renderQuiz(); } };
    footer.appendChild(next);
  }
  main.appendChild(footer);
}

function finishPractice(){
  const {list, answers, title} = quizState;
  let correct=0;
  list.forEach(q=>{ if(answers[q.id]===q.a) correct++; });
  renderResult(correct, list.length, title, false);
}
function submitExam(){
  if(quizState.timer) clearInterval(quizState.timer);
  const {list, answers, title} = quizState;
  let correct=0;
  list.forEach(q=>{
    const ok = answers[q.id]===q.a;
    if(ok) correct++;
    markAttempt(q.id, ok);
  });
  saveProgress();
  renderResult(correct, list.length, title, true);
}

function renderResult(correct, total, title, isExam){
  const pct = Math.round(correct/total*100);
  const pass = pct>=60;
  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>${title} 결과</h2></div>
    <div class="q-card result-hero">
      <div class="result-score">${correct} / ${total}</div>
      <div class="result-sub">정답률 ${pct}%</div>
      ${isExam ? `<div class="pass-badge ${pass?'pass':'fail'}">${pass?'합격 (60점 이상)':'불합격 (60점 미만)'}</div>` : ''}
    </div>
    <button class="primary-btn" id="toHome">홈으로</button>
    <button class="secondary-btn" id="toWrong">오답노트 보기</button>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };
  document.getElementById('toHome').onclick = ()=>{ currentTab="home"; render(); };
  document.getElementById('toWrong').onclick = ()=>{ currentTab="wrong"; render(); };
}

/* ================= 라벨링(부위별 뼈 이름 채우기) 화면 ================= */
function renderLabelPartSelect(){
  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>뼈 이름 라벨링 연습</h2></div>
    <div class="level-note">부위를 고르면 실제 강의자료 그림이 뜨고, 번호가 매겨진 위치마다 신용어·구용어·영어를 채워넣습니다. (이번 기능은 세션 동안만 채점 기록이 유지됩니다)</div>
    <div class="section-title">부위 선택</div>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };
  LABEL_PARTS.forEach(part=>{
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.innerHTML = `
      <div class="ic blue">${part.emoji}</div>
      <div class="body"><h3>${part.name}</h3><p>${part.bones.length}개 뼈</p></div>
      <div class="chev">›</div>`;
    item.onclick = ()=> renderLabelPractice(part.id);
    main.appendChild(item);
  });
}

function renderLabelPractice(partId){
  const part = LABEL_PARTS.find(p=>p.id===partId);

  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>${part.name} 라벨링</h2></div>
    <div id="labelImages"></div>
    <div class="section-title">그림 속 번호 — 용어 채우기</div>
    <div id="labelRows"></div>
    <button class="primary-btn" id="gradeBtn">채점하기</button>
    <div id="labelResultWrap"></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };

  const imgWrap = document.getElementById('labelImages');
  part.images.forEach(img=>{
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.marginBottom = '10px';
    card.style.position = 'relative';
    card.style.padding = '0';
    card.style.overflow = 'hidden';
    card.innerHTML = `
      <div style="position:relative;width:100%;line-height:0;">
        <img src="${img.src}" style="width:100%;display:block;" alt="뼈 그림">
        ${img.markers.map(m=>`
          <div style="position:absolute;left:${m.x}%;top:${m.y}%;transform:translate(-50%,-50%);
                      width:26px;height:26px;border-radius:50%;background:var(--accent-deep);
                      color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
                      box-shadow:0 0 0 2px #fff;">${m.num}</div>
        `).join("")}
      </div>
    `;
    imgWrap.appendChild(card);
  });

  function buildRow(b){
    const row = document.createElement('div');
    row.className = 'q-card';
    row.style.marginBottom = '10px';
    const cols = b.hanja ? '1fr 1fr 1fr' : '1fr 1fr';
    row.innerHTML = `
      <div style="font-weight:700;font-size:14px;margin-bottom:8px;">
        ${b.num}번 ${b.note ? `<span style="font-weight:400;color:var(--text-soft);font-size:12px;">(${b.note})</span>` : ``}
      </div>
      <div style="display:grid;grid-template-columns:${cols};gap:6px;">
        <input type="text" placeholder="신용어" data-bone="${b.num}" data-field="ko" class="choice-btn" style="padding:8px;">
        ${b.hanja ? `<input type="text" placeholder="구용어" data-bone="${b.num}" data-field="hanja" class="choice-btn" style="padding:8px;">` : ``}
        <input type="text" placeholder="English" data-bone="${b.num}" data-field="en" class="choice-btn" style="padding:8px;">
      </div>
      ${!b.hanja ? `<div class="acc-sub" style="margin-top:4px;">구용어는 자료에 없어 생략했습니다.</div>` : ``}
      <div id="labelFeedback-${b.num}"></div>
    `;
    return row;
  }
  const rowsWrap = document.getElementById('labelRows');
  part.bones.forEach(b=> rowsWrap.appendChild(buildRow(b)));

  function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
  function checkField(input, correct){
    const ok = norm(input.value) === norm(correct);
    input.classList.remove('correct','wrong');
    input.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  document.getElementById('gradeBtn').onclick = ()=>{
    let total = 0, correct = 0;
    part.bones.forEach(b=>{
      const koInput = document.querySelector(`input[data-bone="${b.num}"][data-field="ko"]`);
      const enInput = document.querySelector(`input[data-bone="${b.num}"][data-field="en"]`);
      const okKo = checkField(koInput, b.ko);
      const okEn = checkField(enInput, b.en);
      let okHanja = true;
      if(b.hanja){
        const hanjaInput = document.querySelector(`input[data-bone="${b.num}"][data-field="hanja"]`);
        okHanja = checkField(hanjaInput, b.hanja);
        total += 1; correct += okHanja ? 1 : 0;
      }
      total += 2; correct += (okKo?1:0)+(okEn?1:0);
      const fb = document.getElementById(`labelFeedback-${b.num}`);
      if(!(okKo && okHanja && okEn)){
        fb.innerHTML = `<div class="explain-box" style="margin-top:8px;"><b>정답</b><br>${b.ko}${b.hanja ? ` · ${b.hanja}` : ``} · ${b.en}</div>`;
      } else {
        fb.innerHTML = "";
      }
    });
    const pct = Math.round(correct/total*100);
    document.getElementById('labelResultWrap').innerHTML = `
      <div class="q-card result-hero" style="margin-top:14px;">
        <div class="result-score">${correct} / ${total}</div>
        <div class="result-sub">정답률 ${pct}% — 틀린 칸은 빨간색, 아래에 정답 표시</div>
      </div>`;
  };
}

/* ================= 초기 실행 ================= */
(async function init(){
  await loadProgress();
  render();
})();
</script>
