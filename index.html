<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기능해부학 용어 스터디</title>
<style>
  :root{
    --ink:#0b1c2c; --ink-2:#14344a; --accent:#4fb3d9; --accent-deep:#2d7ea3;
    --muscle:#b5453d; --muscle-soft:#f3ded9;
    --paper:#eef1f4; --card:#ffffff; --line:#dbe1e7;
    --text:#152230; --text-soft:#5b6b78;
    --good:#2f8f5b; --good-soft:#e3f3ea;
    --bad:#c0463d; --bad-soft:#fbe6e3;
    --warn:#a5761f; --warn-soft:#fbf1da;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header.top{
    background:linear-gradient(135deg,var(--ink) 0%,var(--ink-2) 65%,var(--accent-deep) 130%);
    color:#fff; padding:22px 20px 18px; position:relative; overflow:hidden;
  }
  header.top::after{
    content:""; position:absolute; right:-40px; top:-30px; width:150px; height:150px;
    border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--accent), transparent 70%); opacity:.55;
  }
  header.top h1{ margin:0; font-size:21px; font-weight:800; letter-spacing:-0.2px; position:relative; }
  header.top p{ margin:6px 0 0; font-size:13px; color:#c8dae6; position:relative; }
  .level-row{ display:flex; gap:6px; margin-top:14px; position:relative; }
  .level-btn{
    flex:1; text-align:center; padding:8px 4px; border-radius:10px;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#dce8ef; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .level-btn.active{ background:#fff; color:var(--ink); border-color:#fff; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .stat-card{ background:var(--card); border-radius:var(--radius); padding:14px 10px; text-align:center; border:1px solid var(--line); }
  .stat-card .num{ font-size:22px; font-weight:800; color:var(--ink); }
  .stat-card .label{ font-size:11.5px; color:var(--text-soft); margin-top:2px; }
  .section-title{ font-size:14px; font-weight:700; color:var(--text-soft); margin:22px 0 10px 2px; }
  .level-note{
    font-size:12px; color:var(--text-soft); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:12px; line-height:1.5;
  }
  main{ flex:1; padding:18px 16px 90px; }

  .acc-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .acc-row{ margin-bottom:12px; }
  .acc-row:last-child{ margin-bottom:0; }
  .acc-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13px; margin-bottom:5px; }
  .acc-head .pname{ font-weight:700; }
  .acc-head .pval{ font-variant-numeric:tabular-nums; font-weight:800; }
  .acc-head .pval.none{ color:var(--text-soft); font-weight:600; font-size:12px; }
  .acc-track{ height:7px; background:var(--line); border-radius:99px; overflow:hidden; }
  .acc-fill{ height:100%; border-radius:99px; }
  .acc-sub{ font-size:11px; color:var(--text-soft); margin-top:3px; }

  .menu-item{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:transform .12s ease;
  }
  .menu-item:active{ transform:scale(.98); }
  .menu-item .ic{ width:38px;height:38px;border-radius:10px; display:flex;align-items:center;justify-content:center; font-size:18px;flex-shrink:0; }
  .menu-item .body h3{ margin:0; font-size:15px; font-weight:700; }
  .menu-item .body p{ margin:2px 0 0; font-size:12.5px; color:var(--text-soft); }
  .menu-item .chev{ margin-left:auto; color:var(--text-soft); font-size:16px; }
  .ic.blue{ background:#e2f1f8; color:var(--accent-deep); }
  .ic.red{ background:var(--bad-soft); color:var(--bad); }
  .ic.gold{ background:var(--warn-soft); color:var(--warn); }
  .ic.green{ background:var(--good-soft); color:var(--good); }

  nav.bottom{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; color:var(--text-soft); padding:6px 2px; cursor:pointer; font-family:inherit;
  }
  nav.bottom button .emoji{ font-size:18px; }
  nav.bottom button.active{ color:var(--accent-deep); font-weight:700; }

  .top-bar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .back-btn{
    background:var(--card); border:1px solid var(--line); width:34px;height:34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center; cursor:pointer; font-size:16px; color:var(--ink); flex-shrink:0;
  }
  .top-bar h2{ font-size:16px; margin:0; font-weight:800; }

  .choice-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .choice-btn{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; text-align:left; font-size:14px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .choice-btn.selected{ border-color:var(--accent-deep); background:#eaf5fa; }
  .choice-btn.correct{ border-color:var(--good); background:var(--good-soft); font-weight:700; }
  .choice-btn.wrong{ border-color:var(--bad); background:var(--bad-soft); font-weight:700; }
  .primary-btn{
    width:100%; background:var(--ink); color:#fff; border:none; border-radius:12px;
    padding:14px; font-size:15px; font-weight:700; cursor:pointer; margin-top:18px; font-family:inherit;
  }
  .primary-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .secondary-btn{
    width:100%; background:transparent; color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:12px; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; font-family:inherit;
  }
  .part-chip{
    display:inline-block; padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); font-size:13px; margin:0 8px 8px 0; cursor:pointer;
  }
  .part-chip.selected{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .quiz-progress{ display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--text-soft); margin-bottom:8px; }
  .quiz-timer{ font-weight:800; color:var(--muscle); font-variant-numeric:tabular-nums; }
  .progress-track{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; margin-bottom:16px; }
  .progress-fill{ height:100%; background:var(--accent-deep); border-radius:99px; }

  .q-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 16px; }
  .q-part-tag{ display:inline-block; font-size:11px; font-weight:700; color:var(--accent-deep); background:#e2f1f8; padding:3px 9px; border-radius:6px; margin-bottom:8px; margin-right:6px; }
  .q-level-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; margin-bottom:8px; margin-right:6px; }
  .q-level-tag.ko{ color:var(--good); background:var(--good-soft); }
  .q-level-tag.mid{ color:var(--warn); background:var(--warn-soft); }
  .q-level-tag.en{ color:var(--bad); background:var(--bad-soft); }
  .q-streak-tag{ display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:6px; margin-bottom:8px; color:var(--warn); background:var(--warn-soft); }
  .q-text{ font-size:16px; font-weight:700; line-height:1.5; margin:0 0 4px; }
  .explain-box{ margin-top:14px; padding:12px 14px; background:var(--muscle-soft); border-radius:10px; font-size:13.5px; line-height:1.5; color:#5a2c26; }
  .explain-box b{ color:var(--muscle); }
  .star-btn{ background:none; border:none; font-size:20px; cursor:pointer; padding:2px 6px; }

  .result-hero{ text-align:center; padding:28px 10px 10px; }
  .result-score{ font-size:44px; font-weight:900; color:var(--ink); }
  .result-sub{ font-size:13.5px; color:var(--text-soft); margin-top:4px; }
  .pass-badge{ display:inline-block; margin-top:12px; padding:6px 16px; border-radius:999px; font-size:13px; font-weight:700; }
  .pass-badge.pass{ background:var(--good-soft); color:var(--good); }
  .pass-badge.fail{ background:var(--bad-soft); color:var(--bad); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-soft); }
  .empty-state .emoji{ font-size:34px; margin-bottom:10px; }
  .empty-state p{ font-size:13.5px; line-height:1.6; margin:4px 0; }

  .review-row{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .review-row .count-badge{ background:var(--bad-soft); color:var(--bad); font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; flex-shrink:0; }
  .review-row .rq{ font-size:13.5px; flex:1; }
  .review-row .streak{ font-size:11px; color:var(--text-soft); flex-shrink:0; }

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease, bottom .25s ease;
    max-width:90%; text-align:center; z-index:50;
  }
  .toast.show{ opacity:1; bottom:88px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>해부학 용어 스터디</h1>
    <p>기능해부학 · 매주 배운 용어 누적</p>
    <div class="level-row" id="levelRow"></div>
    <div class="stat-row" id="statRow"></div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="bottomNav">
    <button data-tab="home"><span class="emoji">🏠</span>홈</button>
    <button data-tab="part"><span class="emoji">📚</span>파트별</button>
    <button data-tab="exam"><span class="emoji">⏱️</span>모의고사</button>
    <button data-tab="wrong"><span class="emoji">📝</span>오답노트</button>
    <button data-tab="fav"><span class="emoji">⭐</span>즐겨찾기</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 문제 데이터 =================
   ko: 한글 질문 + 한글/영어 병기 선택지
   en: 영어 질문 + 영어 전용 선택지
   난이도 '중' = ko 질문 + en 선택지
   a: 정답 인덱스 (ko/en 선택지 순서는 동일하게 맞춰 작성)
================================================ */
const QUESTIONS = [
  {id:"q01", part:"자세·방향",
   ko:{q:"해부학적 자세에서 손바닥은 어느 방향을 향하는가?", opts:["앞(anterior)","뒤(posterior)","안쪽(medial)","위(superior)"]},
   en:{q:"In the anatomical position, which direction do the palms face?", opts:["Anterior","Posterior","Medial","Superior"]},
   a:0, ex:"해부학적 자세는 양발을 모으고 정면을 향한 채, 양팔은 몸에 붙이고 손바닥이 앞을 향하는 기준 자세입니다."},
  {id:"q02", part:"자세·방향",
   ko:{q:"정중선(인체 가운데 선)에 가까워지는 쪽을 가리키는 용어는?", opts:["외측(lateral)","내측(medial)","근위(proximal)","원위(distal)"]},
   en:{q:"Which term refers to the side that moves closer to the midline of the body?", opts:["Lateral","Medial","Proximal","Distal"]},
   a:1, ex:"내측(medial)은 정중선을 향하는 쪽, 외측(lateral)은 정중선에서 멀어지는 쪽입니다."},
  {id:"q03", part:"자세·방향",
   ko:{q:"복장뼈(흉골)와 심장의 위치 관계에서, 심장은 흉골에 대해 어디에 해당하는가?", opts:["anterior(전)","posterior(후)","superior(상)","distal(원위)"]},
   en:{q:"Regarding the position of the sternum and the heart, where is the heart relative to the sternum?", opts:["Anterior","Posterior","Superior","Distal"]},
   a:1, ex:"흉골(복장뼈)이 anterior, 그 뒤에 있는 심장이 posterior에 해당하는 대표적인 예시입니다."},
  {id:"q04", part:"자세·방향",
   ko:{q:"\"팔꿈치는 어깨보다 ___ 이다\" 빈칸에 들어갈 용어는?", opts:["superior(상)","inferior(하)","medial(내측)","proximal(근위)"]},
   en:{q:"\"The elbow is ___ to the shoulder.\" Which term fits the blank?", opts:["Superior","Inferior","Medial","Proximal"]},
   a:1, ex:"어깨보다 머리 쪽에서 멀어지는 팔꿈치는 inferior(하)에 해당합니다."},
  {id:"q05", part:"자세·방향",
   ko:{q:"팔꿈치는 손목보다 어느 쪽에 해당하는가? (사지에서 주로 쓰이는 용어)", opts:["distal(원위)","proximal(근위)","lateral(외측)","superficial(외)"]},
   en:{q:"The elbow is which of the following relative to the wrist? (a term mainly used for limbs)", opts:["Distal","Proximal","Lateral","Superficial"]},
   a:1, ex:"몸통에 더 가까운 팔꿈치가 proximal(근위), 손목은 팔꿈치보다 distal(원위)입니다."},
  {id:"q06", part:"자세·방향",
   ko:{q:"체표면에 가까이 위치하는 쪽을 가리키는 용어는?", opts:["deep(내)","superficial(외)","inferior(하)","distal(원위)"]},
   en:{q:"Which term refers to the side located close to the body surface?", opts:["Deep","Superficial","Inferior","Distal"]},
   a:1, ex:"superficial(외/표층)은 체표면에 가까운 쪽, deep(내/심층)은 체표면보다 더 아래에 위치한 쪽입니다."},

  {id:"q07", part:"면·축",
   ko:{q:"시상면(sagittal plane)은 신체를 어떻게 나누는가?", opts:["좌우(left and right)","전후(front and back)","상하(upper and lower)","내외(inner and outer)"]},
   en:{q:"The sagittal plane divides the body into which parts?", opts:["Left and right parts","Front and back parts","Upper and lower parts","Inner and outer parts"]},
   a:0, ex:"시상면(sagittal plane)은 신체를 좌,우로 나누는 가상의 면입니다."},
  {id:"q08", part:"면·축",
   ko:{q:"관상면(coronal plane)은 신체를 어떻게 나누는가?", opts:["좌, 우로 나눈다","앞, 뒤로 나눈다","상, 하로 나눈다","안, 밖으로 나눈다"]},
   en:{q:"The coronal plane divides the body into which parts?", opts:["Left and right parts","Front and back parts","Upper and lower parts","Inner and outer parts"]},
   a:1, ex:"관상면은 신체를 앞(전)과 뒤(후)로 나누는 가상의 면입니다."},
  {id:"q09", part:"면·축",
   ko:{q:"수평면(horizontal plane)은 신체를 어떻게 나누는가?", opts:["앞, 뒤로 나눈다","좌, 우로 나눈다","상, 하로 나눈다","근위, 원위로 나눈다"]},
   en:{q:"The horizontal plane divides the body into which parts?", opts:["Front and back parts","Left and right parts","Upper and lower parts","Proximal and distal parts"]},
   a:2, ex:"수평면은 신체를 상(위)과 하(아래)로 나누는 가상의 면입니다."},
  {id:"q10", part:"면·축",
   ko:{q:"시상면에서 일어나는 움직임(예: 팔꿈치 굽히기)의 회전축은 무엇인가?", opts:["시상축","관상축","수직축","종축"]},
   en:{q:"What is the axis of rotation for a movement occurring in the sagittal plane (e.g. elbow flexion)?", opts:["Sagittal axis","Coronal axis","Vertical axis","Longitudinal axis"]},
   a:1, ex:"움직임이 일어나는 면과 회전축은 서로 수직입니다. 시상면에서 일어나는 움직임의 회전축은 시상면을 꿰뚫는 관상축입니다."},
  {id:"q11", part:"면·축",
   ko:{q:"관상축(coronal axis)은 어떤 면을 꿰뚫는 축인가?", opts:["관상면","시상면","수평면","정중면"]},
   en:{q:"Which plane does the coronal axis pass through?", opts:["Coronal plane","Sagittal plane","Horizontal plane","Median plane"]},
   a:1, ex:"관상축은 두개골의 관상봉합과 평행한 방향의 축으로, 시상면을 꿰뚫는 축을 의미합니다."},
  {id:"q12", part:"면·축",
   ko:{q:"수직축(vertical axis)은 어떤 면을 꿰뚫는 축인가?", opts:["시상면","관상면","수평면","정중면"]},
   en:{q:"Which plane does the vertical axis pass through?", opts:["Sagittal plane","Coronal plane","Horizontal plane","Median plane"]},
   a:2, ex:"수직축은 중심선과 평행을 이루는 축으로, 수평면을 꿰뚫는 축을 의미합니다."},

  {id:"q13", part:"관절 움직임",
   ko:{q:"두 뼈 사이의 각을 좁히는 움직임을 가리키는 용어는?", opts:["신전(extension)","굴곡(flexion)","외전(abduction)","회전(rotation)"]},
   en:{q:"Which term refers to a movement that decreases the angle between two bones?", opts:["Extension","Flexion","Abduction","Rotation"]},
   a:1, ex:"굽힘/굴곡(flexion)은 두 뼈 사이의 각을 좁히는 움직임이고, 폄/신전(extension)은 그 각을 넓히는 움직임입니다."},
  {id:"q14", part:"관절 움직임",
   ko:{q:"인체의 정중선에서 멀어지는 움직임을 가리키는 용어는?", opts:["내전(adduction)","외전(abduction)","회선(circumduction)","회전(rotation)"]},
   en:{q:"Which term refers to a movement that moves away from the midline of the body?", opts:["Adduction","Abduction","Circumduction","Rotation"]},
   a:1, ex:"ab-는 '멀어지다'라는 뜻의 접두사로, 벌림/외전(abduction)은 정중선에서 멀어지는 움직임입니다. 반대로 ad-(내전)는 정중선에 가까워지는 움직임입니다."},
  {id:"q15", part:"관절 움직임",
   ko:{q:"손목과 팔을 내측면으로 돌려 손등이 위를 향하게 하는 동작은?", opts:["뒤침/회외(supination)","엎침/회내(pronation)","회선(circumduction)","외번(eversion)"]},
   en:{q:"Which movement rotates the wrist and arm medially so that the back of the hand faces upward?", opts:["Supination","Pronation","Circumduction","Eversion"]},
   a:1, ex:"엎침/회내(pronation)는 손등이 위로 향하는 동작, 뒤침/회외(supination)는 손바닥이 위로 향하는 동작입니다."},
  {id:"q16", part:"관절 움직임",

  {id:"q47", part:"근육-종류·특성",

  {id:"q49", part:"근육-종류·특성",

  {id:"q51", part:"근육-종류·특성",

  {id:"q52", part:"근육-종류·특성",

  {id:"q53", part:"근육-종류·특성",

  {id:"q54", part:"근육-종류·특성",

   en:{q:"Which statement about human muscle is correct?", opts:["About 40% of body weight, made up of over 700 skeletal muscles","About 20% of body weight","About 60% of body weight, made up of 300 skeletal muscles","About 40% of body weight, made up of fewer than 100 skeletal muscles"]},

  {id:"q55", part:"근육-종류·특성",

   en:{q:"Which contraction type develops tension while the muscle length visibly changes?", opts:["Isometric contraction","Isotonic contraction","Isokinetic contraction","Relaxation"]},
   a:1, ex:"등장성 수축은 길이가 눈에 띄게 변하며, 단축성(concentric)과 신장성(eccentric)으로 세분화됩니다."},
  {id:"q56", part:"근육-종류·특성",

  {id:"q57", part:"근육-종류·특성",

   a:2, ex:"단축성(concentric)은 수축력 > 저항력일 때 근육이 짧아집니다."},

  {id:"q73", part:"어깨복합체",

   a:2, ex:"A.C 관절은 빗장뼈 바깥쪽 끝과 봉우리돌기(견봉)가 이루는 평면관절입니다."},
  {id:"q74", part:"어깨복합체",

   en:{q:"Which describes the form and composition of the glenohumeral (G.H) joint?", opts:["Plane joint: clavicle - acromion","Ball-and-socket joint: sternum - clavicle","Functional joint: scapula - thoracic cage","Ball-and-socket joint: humeral head - glenoid cavity of scapula"]},

  {id:"q75", part:"어깨복합체",
   ko:{q:"견흉관절(scapulothoracic joint, S.T joint)의 특징으로 옳은 것은?", opts:["해부학적 관절이며 관절낭이 있다","빗장뼈와 봉우리가 이루는 평면관절이다","해부학적 관절이 아닌 기능적 관절이며 관절연골·관절낭이 없다","위팔뼈 머리와 관절오목이 이루는 구상관절이다"]},
   en:{q:"Which is a feature of the scapulothoracic (S.T) joint?", opts:["An anatomical joint with a joint capsule","A plane joint between the clavicle and acromion","A functional (not anatomical) joint without articular cartilage or capsule","A ball-and-socket joint between the humeral head and glenoid cavity"]},

  {id:"q76", part:"어깨복합체",

  {id:"q77", part:"어깨복합체",

  {id:"q78", part:"어깨복합체",
   ko:{q:"G.H 관절에서 회전근개 등 근육의 당김이 제공하는 안정성은?", opts:["능동적 안정성","수동적 안정성","정적 안정성","기능적 불안정성"]},

  {id:"q79", part:"어깨복합체",
   ko:{q:"S.T 관절의 안정성에 대한 설명으로 옳은 것은?", opts:["두 뼈를 연결하는 인대가 직접적으로 있다","앞톱니근, 어깨밑근 등 여러 근육이 어깨뼈를 흉곽에 부착시키고 움직임을 담당한다","관절와순이 안정성을 제공한다","관절낭이 어깨뼈를 고정한다"]},
   en:{q:"Which statement about stability of the S.T joint is correct?", opts:["Ligaments directly connect the two bones","Several muscles such as serratus anterior and subscapularis attach the scapula to the thorax and control its movement","The glenoid labrum provides stability","The joint capsule fixes the scapula"]},
   a:1, ex:"S.T 관절은 두 뼈를 연결하는 인대가 직접적으로 없고, 여러 근육이 어깨뼈를 흉곽에 부착시킵니다."},

  {id:"q81", part:"어깨복합체",
   ko:{q:"앞톱니근(serratus anterior)의 부착점은?", opts:["1~9번 갈비뼈","어깨뼈의 어깨밑오목","어깨뼈 안쪽 가장자리","위팔뼈의 작은결절"]},
   en:{q:"What is the insertion of the serratus anterior?", opts:["Ribs 1-9","Subscapular fossa of the scapula","Medial border of the scapula","Lesser tubercle of the humerus"]},

  {id:"q82", part:"어깨복합체",

  {id:"q83", part:"어깨복합체",

  {id:"q84", part:"어깨복합체",

  {id:"q85", part:"어깨복합체",

  {id:"q88", part:"근육 용어",
   ko:{q:"기시점(origin)과 부착점(insertion)을 비교한 설명으로 옳은 것은?", opts:["기시점은 보통 고정되는 쪽, 부착점은 보통 움직이는 쪽이다","기시점은 보통 움직이는 쪽, 부착점은 보통 고정되는 쪽이다","둘 다 항상 고정되어 있다","둘 다 항상 움직인다"]},

   ko:{q:"동시수축(co-contraction)의 예로 제시된 수축 형태는?", opts:["단축성 수축(concentric)","신장성 수축(eccentric)","등척성 수축(isometric)","등속성 수축(isokinetic)"]},
   en:{q:"Which contraction type is given as an example of co-contraction?", opts:["Concentric contraction","Eccentric contraction","Isometric contraction","Isokinetic contraction"]},
   a:2, ex:"동시수축의 예로 등척성 수축이 제시되어 있습니다."},
  {id:"q98", part:"근육 용어",
   ko:{q:"주동근과 길항근의 효율적인 수축을 위해 신체 분절을 고정시키는 근육은?", opts:["협동근(synergist)","주동근(agonist)","길항근(antagonist)","안정근(stabilizer muscle)"]},
   en:{q:"Which muscle fixes body segments for efficient contraction of the agonist and antagonist?", opts:["Synergist","Agonist","Antagonist","Stabilizer muscle"]},
   a:3, ex:"안정근(stabilizer muscle)은 신체 분절을 고정시킵니다."},
  {id:"q99", part:"근육 용어",
   ko:{q:"팔을 올리는 동작에서 어깨뼈·빗장뼈·위팔뼈가 움직일 때 안정근으로 제시된 것은?", opts:["복장뼈 칼돌기(xiphoid process)","관절와순(glenoid labrum)","회전근개(rotator cuff)","상완이두근(biceps brachii)"]},
   en:{q:"In raising the arm (scapula, clavicle, humerus moving), which is given as the stabilizer?", opts:["Xiphoid process","Glenoid labrum","Rotator cuff","Biceps brachii"]},
   a:2, ex:"팔을 올릴 때 움직이는 것은 어깨뼈·빗장뼈·위팔뼈이고 회전근개가 안정근입니다."},
  {id:"q100", part:"근육 용어",
   ko:{q:"주동근과 길항근이 활성화될 때 효율적인 관절 움직임을 위해 작용하는 근육은?", opts:["안정근(stabilizer muscle)","협동근(synergist)","길항근(antagonist)","주동근(agonist)"]},
   en:{q:"Which muscle acts for efficient joint movement when the agonist and antagonist are activated?", opts:["Stabilizer muscle","Synergist","Antagonist","Agonist"]},
   a:1, ex:"협동근(synergist)은 효율적인 관절 움직임을 위해 작용합니다."},
  {id:"q101", part:"근육 용어",
   ko:{q:"둘 이상의 근육이 서로 다른 직선 방향으로 작용하면서 같은 돌림 방향으로 토크를 발생시키는 것은?", opts:["동시수축(co-contraction)","역동작","등속성 수축(isokinetic contraction)","짝힘(force couple)"]},
   en:{q:"What is it called when two or more muscles act along different lines of pull yet produce torque in the same rotational direction?", opts:["Co-contraction","Reverse action","Isokinetic contraction","Force couple"]},
   a:3, ex:"짝힘(force couple)은 서로 다른 직선 방향의 힘이 같은 돌림 방향으로 토크를 만듭니다."},
  {id:"q102", part:"근육 용어",
   ko:{q:"다음 영어 용어와 한글 용어의 연결이 옳은 것은?", opts:["synergist - 협동근","agonist - 길항근","antagonist - 주동근","stabilizer muscle - 짝힘"]},
   en:{q:"Which English–Korean term pair is correct?", opts:["Synergist - 협동근","Agonist - 길항근","Antagonist - 주동근","Stabilizer muscle - 짝힘"]},
   a:0, ex:"agonist=주동근, antagonist=길항근, synergist=협동근, stabilizer muscle=안정근, force couple=짝힘입니다."},
  {id:"q103", part:"근육 용어",
   ko:{q:"동시수축과 협동근을 구분한 설명으로 옳은 것은?", opts:["동시수축은 신체 분절을 고정하고, 협동근은 같은 돌림 방향 토크를 만든다","동시수축은 주동근과 길항근이 함께 활성화되어 관절을 안정화하고, 협동근은 효율적인 관절 움직임을 위해 작용한다","동시수축은 길항근만 수축하고, 협동근은 주동근만 수축한다","둘은 같은 용어이다"]},
   en:{q:"Which statement correctly distinguishes co-contraction from the synergist?", opts:["Co-contraction fixes body segments; synergist produces torque in the same rotational direction","Co-contraction: agonist and antagonist active together to stabilize the joint; synergist: acts for efficient joint movement","Co-contraction involves only the antagonist; synergist only the agonist","They are the same term"]},
   a:1, ex:"짝힘은 같은 돌림 방향 토크, 안정근은 신체 분절 고정과 연결해 구분하세요."},
  {id:"q104", part:"근육-종류·특성",
   ko:{q:"근육이 뼈에 붙어 신경 자극을 받아 수축하면서 하는 일로 옳은 것은?", opts:["관절운동 없이 뼈의 형태만 유지한다","각 근육이 독립적으로만 작용한다","관절운동을 만들며, 독립적으로 작용하지 않고 협력한다","신경 자극 없이 스스로 수축한다"]},
   en:{q:"What do muscles do when they attach to bone and contract in response to nerve stimulation?", opts:["Only maintain bone shape without producing joint movement","Each muscle works only independently","Produce joint movement and work in cooperation rather than independently","Contract by themselves without nerve stimulation"]},
   a:2, ex:"근육은 뼈에 붙어 신경 자극을 받아 수축하며 관절운동을 만들고, 독립적으로 작용하지 않고 협력합니다."},
  {id:"q105", part:"근육-종류·특성",
   ko:{q:"근육에 신경과 혈관이 잘 분포하는 이유로 옳게 짝지은 것은?", opts:["신경은 자극 전달, 혈관은 에너지(ATP) 공급","신경은 에너지(ATP) 공급, 혈관은 자극 전달","신경과 혈관 모두 뼈의 성장을 담당","신경과 혈관 모두 근육을 이완시키기 위해"]},
   en:{q:"Why are nerves and blood vessels abundantly distributed in muscle?", opts:["Nerves transmit stimuli; blood vessels supply energy (ATP)","Nerves supply energy (ATP); blood vessels transmit stimuli","Both nerves and vessels are for bone growth","Both nerves and vessels exist only to relax muscle"]},
   a:0, ex:"신경이 분포해 자극을 전달하고, 혈관이 잘 분포해 에너지(ATP)를 공급합니다."},
  {id:"q106", part:"근육-종류·특성",
   ko:{q:"단축성(concentric)과 신장성(eccentric) 근육 작용을 비교한 설명으로 옳은 것은?", opts:["단축성은 근육이 길어지고, 신장성은 근육이 짧아진다","둘 다 근육 길이 변화가 없다","단축성은 등속성, 신장성은 등척성에 속한다","단축성은 근육이 짧아지고, 신장성은 근육이 길어진다"]},
   en:{q:"Which comparison of concentric and eccentric muscle actions is correct?", opts:["Concentric: the muscle lengthens; eccentric: the muscle shortens","Neither changes muscle length","Concentric is isokinetic; eccentric is isometric","Concentric: the muscle shortens; eccentric: the muscle lengthens"]},
   a:3, ex:"단축성은 수축력 > 저항력이라 근육이 짧아지고, 신장성은 외부 힘 > 내부 근육 힘이라 근육이 길어집니다. 둘 다 등장성 수축에 속합니다."},
  {id:"q107", part:"근육 용어",
   ko:{q:"견갑골 상방회전에서 상부·하부 승모근과 앞톱니근이 서로 다른 방향으로 당기면서도 같은 회전 토크를 만드는 것을 무엇이라 하는가?", opts:["동시수축(co-contraction)","짝힘(force couple)","역동작","등속성 수축(isokinetic contraction)"]},
   en:{q:"Upper and lower trapezius and serratus anterior pull in different directions yet produce the same rotational torque in upward rotation of the scapula. What is this called?", opts:["Co-contraction","Force couple","Reverse action","Isokinetic contraction"]},
   a:1, ex:"상방회전은 상부·하부 승모근과 전거근이 만드는 짝힘(force couple)입니다. 동시수축은 주동근과 길항근이 함께 활성화되는 것으로 구분됩니다."},
  {id:"q108", part:"근육 용어",
   ko:{q:"팔을 올리는 동작에서 어깨뼈·빗장뼈·위팔뼈가 움직일 때 회전근개의 역할은?", opts:["길항근(antagonist)","안정근(stabilizer muscle)","짝힘(force couple)","동시수축(co-contraction)"]},
   en:{q:"When raising the arm (scapula, clavicle, humerus move), what role does the rotator cuff play?", opts:["Antagonist","Stabilizer muscle","Force couple","Co-contraction"]},
   a:1, ex:"팔을 올릴 때 움직이는 것은 어깨뼈·빗장뼈·위팔뼈이고, 회전근개는 신체 분절을 고정하는 안정근입니다."},
  {id:"q109", part:"근육 용어",
   ko:{q:"기시점(origin)과 부착점(insertion)의 관계에서 '상완이두근'의 예로 옳은 것은?", opts:["기시는 요골 쪽, 정지는 어깨뼈 쪽이다","기시와 정지 모두 어깨뼈에 있다","기시는 복장뼈, 정지는 위팔뼈이다","기시는 어깨뼈 쪽, 정지는 요골 쪽이며 정지 쪽이 움직인다"]},
   en:{q:"In the biceps example of origin vs. insertion, which is correct?", opts:["Origin is on the radius, insertion on the scapula","Both origin and insertion are on the scapula","Origin is on the sternum, insertion on the humerus","Origin is on the scapula, insertion on the radius, and the insertion side moves"]},
   a:3, ex:"상완이두근의 기시=어깨뼈(견갑), 정지=요골이며 정지 쪽이 움직입니다. 장두는 관절와 위쪽, 단두는 오훼돌기에서 시작합니다."},
  {id:"q110", part:"근육 용어",
   ko:{q:"주동근과 길항근의 효율적인 수축을 위해 신체 분절을 고정시키는 근육과, 같은 상황에서 효율적인 관절 움직임을 위해 작용하는 근육을 순서대로 옳게 짝지은 것은?", opts:["안정근(stabilizer muscle), 협동근(synergist)","협동근(synergist), 안정근(stabilizer muscle)","주동근(agonist), 길항근(antagonist)","길항근(antagonist), 주동근(agonist)"]},
   en:{q:"Which pair correctly names, in order, the muscle that fixes body segments and the muscle that acts for efficient joint movement?", opts:["Stabilizer muscle, synergist","Synergist, stabilizer muscle","Agonist, antagonist","Antagonist, agonist"]},
   a:0, ex:"안정근(stabilizer)은 신체 분절을 고정하고, 협동근(synergist)은 주동근·길항근이 활성화될 때 효율적인 관절 움직임을 위해 작용합니다."},
  {id:"q111", part:"어깨복합체",
   ko:{q:"어깨는 가동성을 확보한 대신 구조적 안정성이 낮다. 따라서 어깨를 이해할 때 함께 봐야 하는 것으로 옳은 것은?", opts:["위팔뼈의 길이만","손목뼈의 개수","뼈·관절·인대·견갑골·회전근개·주변 근육의 상호작용","갈비뼈의 개수만"]},
   en:{q:"The shoulder gains mobility at the cost of structural stability. What must therefore be considered together?", opts:["Only the length of the humerus","The number of carpal bones","Interaction of bones, joints, ligaments, scapula, rotator cuff and surrounding muscles","Only the number of ribs"]},
   a:2, ex:"어깨는 뼈·관절·인대·견갑골·회전근개·주변 근육의 상호작용을 함께 봐야 합니다."},
  {id:"q112", part:"어깨복합체",
   ko:{q:"팔 들기 동작에서 움직임이 일어나는 방식으로 옳은 것은?", opts:["상완골만 움직이고 나머지 뼈는 고정된다","견갑골만 움직이고 상완골은 고정된다","상완골은 견갑골에 대해, 견갑골은 흉곽 위에서 회전하고, 쇄골도 함께 움직인다","쇄골만 회전하고 견갑골은 움직이지 않는다"]},
   en:{q:"Which describes how movement occurs when the arm is raised?", opts:["Only the humerus moves; the other bones stay fixed","Only the scapula moves; the humerus stays fixed","The humerus moves relative to the scapula, the scapula rotates on the thorax, and the clavicle also moves","Only the clavicle rotates; the scapula does not move"]},
   a:2, ex:"팔을 들 때 상완골은 견갑골에 대해 움직이고, 견갑골은 흉곽 위에서 회전하며, 쇄골도 흉골과 견갑골 사이에서 움직입니다."},
  {id:"q113", part:"어깨복합체",
   ko:{q:"어깨복합체에서 뼈의 연결 체계를 몸통에서 바깥쪽 순서로 옳게 나열한 것은?", opts:["흉골 → 쇄골 → 견갑골 → 상완골","쇄골 → 흉골 → 견갑골 → 상완골","견갑골 → 쇄골 → 흉골 → 상완골","흉골 → 견갑골 → 쇄골 → 상완골"]},
   en:{q:"Which lists the connection sequence of the shoulder complex from trunk outward?", opts:["Sternum → clavicle → scapula → humerus","Clavicle → sternum → scapula → humerus","Scapula → clavicle → sternum → humerus","Sternum → scapula → clavicle → humerus"]},
   a:0, ex:"연결 체계는 흉골 → 쇄골 → 견갑골 → 상완골 순서입니다."},
  {id:"q114", part:"어깨복합체",
   ko:{q:"복장빗장관절(S.C joint)의 관절원판(섬유연골판)의 역할로 옳은 것은?", opts:["위팔뼈 머리와 관절오목을 깊게 한다","어깨뼈를 흉곽에 직접 고정한다","봉우리와 빗장뼈 사이를 근육으로 연결한다","관절면 사이에서 충격을 분산하고 관절 적합성을 높인다"]},
   en:{q:"What is the role of the articular disc (fibrocartilage) of the S.C joint?", opts:["Deepens the glenoid cavity for the humeral head","Fixes the scapula directly to the thorax","Connects acromion and clavicle by muscle","Distributes impact between articular surfaces and improves joint congruence"]},
   a:3, ex:"S.C 관절의 관절원판은 관절면 사이에서 충격을 분산하고 관절 적합성을 높입니다. 원본 표현으로는 안쪽에서 가해지는 힘의 충격을 흡수하고 위쪽으로의 변위를 막습니다."},
  {id:"q115", part:"어깨복합체",
   ko:{q:"빗장뼈(쇄골, clavicle)의 만곡 형태로 옳은 것은?", opts:["안쪽은 뒤로, 가쪽은 앞으로 만곡","안쪽은 앞으로, 가쪽은 뒤로 만곡","전체가 직선이다","안쪽과 가쪽 모두 앞으로만 만곡"]},
   en:{q:"Which describes the curvature of the clavicle?", opts:["Medial part curves posteriorly; lateral part curves anteriorly","Medial part curves anteriorly; lateral part curves posteriorly","It is entirely straight","Both parts curve only anteriorly"]},
   a:1, ex:"빗장뼈는 안쪽은 앞으로 만곡하고, 가쪽으로 갈수록 뒤로 만곡합니다."},
  {id:"q116", part:"어깨복합체",
   ko:{q:"빗장뼈가 '버팀대' 역할을 하는 이유로 옳은 것은?", opts:["어깨뼈를 몸통에 붙여 움직이지 못하게 한다","어깨와 상지를 몸통에서 떨어뜨려 팔이 자유롭게 움직일 공간을 확보한다","위팔뼈 머리를 깊게 감싼다","갈비뼈를 위쪽으로 당긴다"]},
   en:{q:"Why does the clavicle act as a strut?", opts:["It glues the scapula to the trunk so it cannot move","It holds the shoulder and limb away from the trunk, giving the arm space to move freely","It deeply encloses the humeral head","It pulls the ribs upward"]},
   a:1, ex:"쇄골은 버팀대 역할로 어깨(견갑골)와 상지를 몸통으로부터 떨어뜨려 놓아 팔이 자유롭게 움직이는 공간을 확보합니다."},
  {id:"q117", part:"어깨복합체",
   ko:{q:"팔을 올릴 때 빗장뼈의 움직임으로 옳은 것은?", opts:["하강하고 전방 회전한다","움직이지 않는다","안쪽으로만 미끄러진다","상승하고 후방 회전한다"]},
   en:{q:"How does the clavicle move when the arm is raised?", opts:["It depresses and rotates anteriorly","It does not move","It only slides medially","It elevates and rotates posteriorly"]},
   a:3, ex:"팔을 올릴 때 쇄골은 상승·후방 회전하며 견갑골의 상방회전과 함께 움직입니다."},
  {id:"q118", part:"어깨복합체",
   ko:{q:"어깨뼈(견갑골, scapula)의 일반적 특징으로 옳은 것은?", opts:["삼각형이며 위팔뼈 머리와 관절면을 이루고 많은 근육의 부착점이 된다","원통형이며 복장뼈와 직접 관절한다","근육이 거의 붙지 않는 뼈이다","갈비뼈와 척추 사이의 관절면이다"]},
   en:{q:"Which is a general feature of the scapula?", opts:["Triangular, forms the joint surface with the humeral head, and serves as an attachment for many muscles","Cylindrical and articulates directly with the sternum","A bone to which few muscles attach","The articular surface between rib and spine"]},
   a:0, ex:"견갑골은 삼각형 형태로 위팔뼈 머리와 관절면(G.H joint)을 이루며 많은 근육의 부착점 역할을 합니다."},
  {id:"q119", part:"어깨복합체",
   ko:{q:"견갑극(어깨뼈 가시)이 나누는 견갑골 뒷면의 위쪽 오목과 아래쪽 오목을 순서대로 옳게 짝지은 것은?", opts:["극하와(infraspinous fossa), 극상와(supraspinous fossa)","극상와(supraspinous fossa), 견갑하와(subscapular fossa)","극상와(supraspinous fossa), 극하와(infraspinous fossa)","견갑하와(subscapular fossa), 극하와(infraspinous fossa)"]},
   en:{q:"Which pair names, in order, the fossa above and below the scapular spine on the posterior scapula?", opts:["Infraspinous fossa, supraspinous fossa","Supraspinous fossa, subscapular fossa","Supraspinous fossa, infraspinous fossa","Subscapular fossa, infraspinous fossa"]},
   a:2, ex:"견갑극은 견갑골 뒷면을 위 극상와(가시위오목, supraspinous fossa)와 아래 극하와(가시아래오목, infraspinous fossa)로 나눕니다."},
  {id:"q120", part:"어깨복합체",
   ko:{q:"견봉(봉우리, acromion)에 대한 설명으로 옳은 것은?", opts:["갈고리 모양으로 앞쪽에 돌출된 구조이다","복장뼈와 S.C 관절을 이룬다","견갑극이 가쪽으로 연장되어 넓어진 부분으로 쇄골 가쪽 끝과 A.C 관절을 이룬다","위팔뼈 머리와 G.H 관절을 이룬다"]},
   en:{q:"Which statement about the acromion is correct?", opts:["A hook-shaped structure projecting anteriorly","Forms the S.C joint with the sternum","The widened lateral extension of the scapular spine; forms the A.C joint with the lateral end of the clavicle","Forms the G.H joint with the humeral head"]},
   a:2, ex:"견봉은 견갑극이 가쪽으로 연장되어 넓어진 부분으로, 쇄골 가쪽 끝과 연결되어 견봉쇄골관절(A.C joint)을 이룹니다."},
  {id:"q121", part:"어깨복합체",
   ko:{q:"견갑골 앞쪽으로 돌출된 갈고리 모양 구조이며 소흉근의 정지점인 것은?", opts:["오훼돌기(부리돌기, coracoid process)","견봉(봉우리, acromion)","견갑극(어깨뼈 가시, spine of scapula)","대결절(greater tubercle)"]},
   en:{q:"Which hook-shaped structure projects anteriorly from the scapula and is the insertion of pectoralis minor?", opts:["Coracoid process","Acromion","Spine of scapula","Greater tubercle"]},
   a:0, ex:"오훼돌기(부리돌기, coracoid process)는 소흉근의 정지점이며, 상완이두근 단두와 오훼완근의 기시점입니다."},
  {id:"q122", part:"어깨복합체",
   ko:{q:"오훼돌기(coracoid process)에서 시작하는 근육 두 가지로 옳은 것은?", opts:["소흉근, 앞톱니근","극상근, 극하근","삼각근, 광배근","상완이두근 단두, 오훼완근"]},
   en:{q:"Which two muscles originate from the coracoid process?", opts:["Pectoralis minor, serratus anterior","Supraspinatus, infraspinatus","Deltoid, latissimus dorsi","Short head of biceps brachii, coracobrachialis"]},
   a:3, ex:"오훼돌기는 소흉근의 정지점이고, 상완이두근 단두와 오훼완근의 기시점입니다."},
  {id:"q123", part:"어깨근육-견갑골",
   ko:{q:"견갑골에 부착된 근육의 두 분류로 옳은 것은?", opts:["상지 근육 / 하지 근육","견갑골을 몸통에 대해 움직이는 근육 / 견갑골에서 시작해 상완골을 움직이는 근육","수의근 / 불수의근","굴곡근 / 신전근"]},
   en:{q:"Which are the two groups of muscles attached to the scapula?", opts:["Upper limb muscles / lower limb muscles","Muscles moving the scapula on the trunk / muscles arising from the scapula that move the humerus","Voluntary / involuntary muscles","Flexors / extensors"]},
   a:1, ex:"견갑골에 부착된 근육은 ① 견갑골을 몸통에 대해 움직이는 근육(승모근, 능형근, 전거근, 소흉근 등)과 ② 견갑골에서 시작해 상완골을 움직이는 근육(삼각근, 회전근개 등)으로 나뉩니다."},
  {id:"q124", part:"어깨근육-견갑골",
   ko:{q:"다음 중 '견갑골을 몸통에 대해 움직이는 근육'에 해당하는 것은?", opts:["어깨세모근(삼각근, deltoid)","등세모근(승모근, trapezius)","큰원근(대원근, teres major)","위팔두갈래근(상완이두근, biceps brachii)"]},
   en:{q:"Which of the following moves the scapula on the trunk?", opts:["Deltoid","Trapezius","Teres major","Biceps brachii"]},
   a:1, ex:"승모근, 능형근, 전거근, 소흉근은 견갑골을 몸통에 대해 움직입니다. 삼각근과 회전근개는 견갑골에서 시작해 상완골을 움직입니다."},
  {id:"q125", part:"어깨근육-견갑골",
   ko:{q:"등세모근(승모근, trapezius)의 기시점으로 옳은 것은?", opts:["위쪽 4개 목뼈의 가로돌기","C7–T5 가시돌기","1~9번 갈비뼈","바깥뒤통수뼈융기, 목덜미인대, 제7목뼈와 모든 등뼈의 가시돌기"]},
   en:{q:"What is the origin of the trapezius?", opts:["Transverse processes of the upper four cervical vertebrae","Spinous processes of C7–T5","Ribs 1-9","External occipital protuberance, nuchal ligament, spinous processes of C7 and all thoracic vertebrae"]},
   a:3, ex:"승모근의 기시: 바깥뒤통수뼈융기, 목덜미인대, 제7목뼈와 모든 등뼈(흉추)의 가시돌기. 뒤통수에서 시작해 경추·흉추를 따라 넓게 내려오는 큰 근육입니다."},
  {id:"q126", part:"어깨근육-견갑골",
   ko:{q:"등세모근(승모근)의 부착점으로 옳은 것은?", opts:["어깨뼈가시, 봉우리, 쇄골 가쪽 1/3","견갑골 내측연","쇄골 중간 1/3 아래면","상완골 대결절"]},
   en:{q:"What is the insertion of the trapezius?", opts:["Spine of scapula, acromion, lateral third of clavicle","Medial border of the scapula","Underside of the middle third of the clavicle","Greater tubercle of the humerus"]},
   a:0, ex:"승모근의 부착점: 어깨뼈가시(견갑극), 봉우리(견봉), 쇄골 가쪽 1/3."},
  {id:"q127", part:"어깨근육-견갑골",
   ko:{q:"등세모근의 상부 섬유가 일으키는 견갑골 움직임은?", opts:["견갑골 하강","견갑골 전인","견갑골 상승","견갑골 후인"]},
   en:{q:"What scapular movement do the upper fibers of the trapezius produce?", opts:["Scapular depression","Scapular protraction","Scapular elevation","Scapular retraction"]},
   a:2, ex:"승모근 상부는 견갑골 상승, 중부는 후인, 하부는 하강·안정화입니다."},
  {id:"q128", part:"어깨근육-견갑골",
   ko:{q:"등세모근의 중부 섬유가 일으키는 견갑골 움직임은?", opts:["견갑골 전인(protraction)","견갑골 상승(elevation)","견갑골 후인(retraction)","견갑골 하강(depression)"]},
   en:{q:"What scapular movement do the middle fibers of the trapezius produce?", opts:["Scapular protraction","Scapular elevation","Scapular retraction","Scapular depression"]},
   a:2, ex:"승모근 중부는 견갑골 후인(뒤당김)입니다. 상부는 상승, 하부는 하강·안정화입니다."},
  {id:"q129", part:"어깨근육-견갑골",
   ko:{q:"등세모근의 하부 섬유가 일으키는 견갑골 움직임은?", opts:["견갑골 하강과 안정화","견갑골 상승","견갑골 전인","견갑골 하방회전"]},
   en:{q:"What scapular movement do the lower fibers of the trapezius produce?", opts:["Scapular depression and stabilization","Scapular elevation","Scapular protraction","Scapular downward rotation"]},
   a:0, ex:"승모근 하부는 견갑골 하강·안정화입니다."},
  {id:"q130", part:"어깨근육-견갑골",
   ko:{q:"견갑골 하강(depression)의 핵심 근육은?", opts:["어깨올림근(견갑거근, levator scapulae)","등세모근 상부 섬유(upper trapezius)","가시위근(극상근, supraspinatus)","등세모근 하부 섬유(lower trapezius)"]},
   en:{q:"Which is the key muscle for scapular depression?", opts:["Levator scapulae","Trapezius (upper fibers)","Supraspinatus","Trapezius (lower fibers)"]},
   a:3, ex:"견갑골 하강의 핵심은 하부 승모근(Trapezius lower fibers)입니다. 소흉근과 전거근(하부 섬유)도 하강에 작용하며, 광배근과 쇄골하근은 간접적으로 관여합니다."},
  {id:"q131", part:"어깨근육-견갑골",
   ko:{q:"견갑골 상승(elevation)에 작용하는 근육으로 옳은 것은?", opts:["하부 승모근, 소흉근, 전거근 하부","상부 승모근, 견갑거근, 능형근","중부 승모근, 능형근","소흉근, 전거근"]},
   en:{q:"Which muscles act in scapular elevation?", opts:["Lower trapezius, pectoralis minor, lower serratus anterior","Upper trapezius, levator scapulae, rhomboids","Middle trapezius, rhomboids","Pectoralis minor, serratus anterior"]},
   a:1, ex:"견갑골 상승은 상부 승모근, 견갑거근, 능형근이 담당합니다."},
  {id:"q132", part:"어깨근육-견갑골",
   ko:{q:"견갑골 후인(retraction)에 작용하는 근육으로 옳은 것은?", opts:["소흉근, 전거근","중부 승모근, 능형근","상부 승모근, 가시위근","삼각근 앞섬유, 오훼완근"]},
   en:{q:"Which muscles act in scapular retraction?", opts:["Pectoralis minor, serratus anterior","Middle trapezius, rhomboids","Upper trapezius, supraspinatus","Anterior deltoid, coracobrachialis"]},
   a:1, ex:"견갑골 후인: 중부 승모근, 능형근 (강의 영상에서 수정된 내용)."},
  {id:"q133", part:"어깨근육-견갑골",
   ko:{q:"견갑골 전인(protraction)에 작용하는 근육으로 옳은 것은?", opts:["중부 승모근, 능형근","상부 승모근, 견갑거근","광배근, 대원근","소흉근, 전거근"]},
   en:{q:"Which muscles act in scapular protraction?", opts:["Middle trapezius, rhomboids","Upper trapezius, levator scapulae","Latissimus dorsi, teres major","Pectoralis minor, serratus anterior"]},
   a:3, ex:"견갑골 전인: 소흉근, 전거근. 후인(중부 승모근, 능형근)과 반대 움직임입니다."},
  {id:"q134", part:"어깨근육-견갑골",
   ko:{q:"견갑골 상방회전(upward rotation)에 협력하는 근육으로 옳은 것은?", opts:["상부·하부 승모근, 전거근","견갑거근, 소흉근, 능형근","중부 승모근, 능형근","가시위근, 가시아래근"]},
   en:{q:"Which muscles cooperate in upward rotation of the scapula?", opts:["Upper and lower trapezius, serratus anterior","Levator scapulae, pectoralis minor, rhomboids","Middle trapezius, rhomboids","Supraspinatus, infraspinatus"]},
   a:0, ex:"상방회전은 상부·하부 승모근과 전거근이 협력하는 짝힘입니다. 견갑거근·능형근·소흉근은 하방회전 근육입니다."},
  {id:"q135", part:"어깨근육-견갑골",
   ko:{q:"견갑골 하방회전(downward rotation)에 작용하는 근육으로 옳은 것은?", opts:["상부·하부 승모근, 전거근","중부 승모근, 전거근","견갑거근, 소흉근, 능형근","삼각근, 오훼완근"]},
   en:{q:"Which muscles act in downward rotation of the scapula?", opts:["Upper and lower trapezius, serratus anterior","Middle trapezius, serratus anterior","Levator scapulae, pectoralis minor, rhomboids","Deltoid, coracobrachialis"]},
   a:2, ex:"하방회전은 견갑거근, 소흉근, 능형근이며 짝힘입니다. 상방회전(승모근 상부·하부, 전거근)과 구분하세요."},
  {id:"q136", part:"어깨근육-견갑골",
   ko:{q:"견갑골 하방회전이 짝힘인 이유로 옳은 것은?", opts:["주동근과 길항근이 동시에 수축하기 때문","근육 길이가 변하지 않기 때문","서로 다른 방향으로 당기지만 같은 회전 방향의 토크를 만들기 때문","한 근육이 모든 움직임을 담당하기 때문"]},
   en:{q:"Why is downward rotation of the scapula a force couple?", opts:["The agonist and antagonist contract simultaneously","Muscle length does not change","They pull in different directions yet produce torque in the same rotational direction","One muscle performs the whole movement"]},
   a:2, ex:"견갑거근·능형근은 견갑골 안쪽 위를 위·안쪽으로, 소흉근은 오훼돌기를 앞·아래로 당겨 서로 다른 방향이지만 같은 회전(관절오목이 아래로) 방향 토크를 만듭니다."},
  {id:"q137", part:"어깨근육-견갑골",
   ko:{q:"어깨올림근(견갑거근, levator scapulae)의 기시점은?", opts:["위쪽 4개 목뼈의 가로돌기","C7–T5 가시돌기","1~9번 갈비뼈","3~5번 갈비뼈"]},
   en:{q:"What is the origin of levator scapulae?", opts:["Transverse processes of the upper four cervical vertebrae","Spinous processes of C7–T5","Ribs 1-9","Ribs 3-5"]},
   a:0, ex:"견갑거근의 기시: 위쪽 4개 목뼈의 가로돌기(상부 4 경추 횡돌기)."},
  {id:"q138", part:"어깨근육-견갑골",
   ko:{q:"어깨올림근(견갑거근)의 부착점은?", opts:["오훼돌기","쇄골 중간 1/3 아래면","상완골 소결절","견갑골 상각 및 내측연 위쪽"]},
   en:{q:"What is the insertion of levator scapulae?", opts:["Coracoid process","Underside of the middle third of the clavicle","Lesser tubercle of the humerus","Superior angle and upper medial border of the scapula"]},
   a:3, ex:"견갑거근의 부착: 견갑골 상각 및 내측연 위쪽."},
  {id:"q139", part:"어깨근육-견갑골",
   ko:{q:"어깨올림근(견갑거근)의 작용으로 옳은 것은?", opts:["견갑골 하강, 상방회전","견갑골 상승, 하방회전","견갑골 전인, 상방회전","팔 외전"]},
   en:{q:"What are the actions of levator scapulae?", opts:["Scapular depression and upward rotation","Scapular elevation and downward rotation","Scapular protraction and upward rotation","Arm abduction"]},
   a:1, ex:"견갑거근은 견갑골 상승과 하방회전을 합니다(능형근도 하방회전). 하강 근육이 아니라 상승 근육입니다."},
  {id:"q140", part:"어깨근육-견갑골",
   ko:{q:"위쪽 4개 목뼈의 가로돌기에서 시작해 견갑골 상각 및 내측연 위쪽에 붙는 근육은?", opts:["마름근(능형근, rhomboid)","어깨올림근(견갑거근, levator scapulae)","앞톱니근(전거근, serratus anterior)","작은가슴근(소흉근, pectoralis minor)"]},
   en:{q:"Which muscle arises from the transverse processes of the upper four cervical vertebrae and inserts on the superior angle and upper medial border of the scapula?", opts:["Rhomboid","Levator scapulae","Serratus anterior","Pectoralis minor"]},
   a:1, ex:"견갑거근(levator scapulae)입니다."},
  {id:"q141", part:"어깨근육-견갑골",
   ko:{q:"마름근(능형근, rhomboid)의 기시점은?", opts:["위쪽 4개 목뼈의 가로돌기","1번 갈비뼈","T7–L5 가시돌기","C7–T5 가시돌기"]},
   en:{q:"What is the origin of the rhomboids?", opts:["Transverse processes of the upper four cervical vertebrae","First rib","Spinous processes of T7–L5","Spinous processes of C7–T5"]},
   a:3, ex:"능형근의 기시: C7–T5 가시돌기."},
  {id:"q142", part:"어깨근육-견갑골",
   ko:{q:"마름근(능형근)의 부착점은?", opts:["견갑골 내측연","오훼돌기","쇄골 가쪽 1/3","상완골 대결절"]},
   en:{q:"What is the insertion of the rhomboids?", opts:["Medial border of the scapula","Coracoid process","Lateral third of the clavicle","Greater tubercle of the humerus"]},
   a:0, ex:"능형근의 부착: 견갑골 내측연. (원본 슬라이드는 어깨뼈 가시로 표기되어 있으나 정리본은 견갑골 내측연 기준입니다.)"},
  {id:"q143", part:"어깨근육-견갑골",

   a:3, ex:"오훼완근은 팔 굴곡, 내전을 하는 협력·보조근입니다."},
  {id:"q190", part:"어깨근육-위팔",
   ko:{q:"위팔세갈래근(상완삼두근, triceps brachii)의 기시점으로 옳은 것은?", opts:["장두: 관절와 아래결절 / 외측두·내측두: 위팔뼈 뒤쪽 몸통","장두: 오훼돌기 / 외측두·내측두: 요골","세 갈래 모두 견갑골에서 시작한다","장두: 관절와 위쪽 / 단두: 오훼돌기"]},
   en:{q:"What are the origins of the heads of the triceps brachii?", opts:["Long head: infraglenoid tubercle / Lateral and medial heads: posterior humeral shaft","Long head: coracoid process / Lateral and medial heads: radius","All three heads arise from the scapula","Long head: supraglenoid tubercle / Short head: coracoid process"]},
   a:0, ex:"장두: 견갑골 관절와 아래결절(관절오목아래결절) / 외측두·내측두: 위팔뼈 뒤쪽 몸통."},
  {id:"q191", part:"어깨근육-위팔",
   ko:{q:"위팔세갈래근(상완삼두근)의 부착점은?", opts:["요골조면","상완골 소결절","척골의 주두돌기","삼각근 조면"]},
   en:{q:"What is the insertion of the triceps brachii?", opts:["Radial tuberosity","Lesser tubercle of the humerus","Olecranon process of the ulna","Deltoid tuberosity"]},
   a:2, ex:"삼두근은 척골(자뼈)의 주두돌기(팔꿈치머리돌기)에 정지합니다."},
  {id:"q192", part:"어깨근육-위팔",
   ko:{q:"위팔세갈래근(상완삼두근)의 작용으로 옳은 것은?", opts:["팔꿈치 굴곡","전완 회외","팔꿈치 폄 (장두는 어깨 신전·내전에도 기여)","세 갈래 모두 어깨 신전에 기여"]},
   en:{q:"What are the actions of the triceps brachii?", opts:["Elbow flexion","Forearm supination","Elbow extension (long head also contributes to shoulder extension and adduction)","All three heads contribute to shoulder extension"]},
   a:2, ex:"삼두근의 공통 작용은 팔꿈치 폄이며, 그중 장두만 어깨 신전·내전에 기여합니다."},
  {id:"q193", part:"어깨근육-위팔",
   ko:{q:"삼두근 중 어깨 신전·내전에 기여하는 부분은?", opts:["장두(long head)","외측두(lateral head)","내측두(medial head)","세 갈래 모두"]},
   en:{q:"Which part of the triceps contributes to shoulder extension and adduction?", opts:["Long head","Lateral head","Medial head","All three heads"]},
   a:0, ex:"견갑골 관절와 아래결절에서 시작하는 장두만 어깨에 걸쳐 어깨 신전·내전에 기여합니다."},
  {id:"q194", part:"어깨근육-위팔",
   ko:{q:"위팔두갈래근과 위팔세갈래근을 비교한 설명으로 옳은 것은?", opts:["이두근은 팔꿈치 폄, 삼두근은 팔꿈치 굴곡","둘 다 요골조면에 정지한다","둘 다 견갑골 오훼돌기에서 시작한다","이두근은 요골에 정지해 팔꿈치 굴곡, 삼두근은 척골 주두돌기에 정지해 팔꿈치 폄"]},
   en:{q:"Which comparison of biceps brachii and triceps brachii is correct?", opts:["Biceps extends the elbow; triceps flexes it","Both insert on the radial tuberosity","Both arise from the coracoid process","Biceps inserts on the radius for elbow flexion; triceps inserts on the olecranon of the ulna for elbow extension"]},
   a:3, ex:"이두근은 요골조면에 정지해 팔꿈치 굴곡·전완 회외를, 삼두근은 척골 주두돌기에 정지해 팔꿈치 폄을 합니다. arm curl에서는 이두근이 주동근, 삼두근이 길항근입니다."},
  {id:"q195", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬(견갑상완리듬, scapulohumeral rhythm)의 정의로 옳은 것은?", opts:["팔꿈치와 손목의 협응 움직임","팔을 들어 올릴 때 어깨뼈와 위팔뼈가 움직이는 협동 공식","척추와 골반의 협응 움직임","위팔뼈만 단독으로 움직이는 방식"]},
   en:{q:"What is scapulohumeral rhythm?", opts:["Coordinated movement of the elbow and wrist","The coordinated pattern of scapular and humeral movement when the arm is raised","Coordinated movement of the spine and pelvis","Movement of the humerus alone"]},
   a:1, ex:"팔을 들어 올릴 때 어깨뼈와 위팔뼈가 움직이는 협동 공식으로, 핵심은 견관절과 견갑골의 협응입니다."},
  {id:"q196", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬에서 초기(0°~30°)의 특징으로 옳은 것은?", opts:["위팔뼈와 어깨뼈가 1:1로 움직인다","위팔뼈가 주로 움직이고 어깨뼈는 거의 움직이지 않는 준비 단계","쇄골이 40° 상승한다","어깨뼈만 움직인다"]},
   en:{q:"Which describes the initial phase (0°–30°) of scapulohumeral rhythm?", opts:["Humerus and scapula move at a 1:1 ratio","The humerus mainly moves while the scapula barely moves — the setting phase","The clavicle elevates 40°","Only the scapula moves"]},
   a:1, ex:"초기(0~30°)는 준비 단계(Setting Phase)로 위팔뼈가 주로 움직이고 어깨뼈는 거의 움직이지 않으며 쇄골의 움직임도 미미합니다."},
  {id:"q197", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬 중기(30°~90°)의 비율로 옳은 것은?", opts:["위팔뼈 1° : 어깨뼈 1°","위팔뼈 1° : 어깨뼈 2°","위팔뼈 3° : 어깨뼈 1°","위팔뼈 2° : 어깨뼈 1°"]},
   en:{q:"What is the ratio in the middle phase (30°–90°) of scapulohumeral rhythm?", opts:["Humerus 1° : scapula 1°","Humerus 1° : scapula 2°","Humerus 3° : scapula 1°","Humerus 2° : scapula 1°"]},
   a:3, ex:"중기(30~90°)는 위팔뼈가 2도 움직일 때 어깨뼈가 1도 위쪽으로 도는 2:1 비율이며 어깨뼈가 받침대 역할을 시작합니다."},
  {id:"q198", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬 후기(90°~180°)의 비율과 특징으로 옳은 것은?", opts:["1:1 비율이며 쇄골까지 적극적으로 움직여 관절 충돌을 막는다","2:1 비율이며 어깨뼈가 움직이지 않는다","위팔뼈만 움직이고 쇄골은 고정된다","준비 단계로 움직임이 거의 없다"]},
   en:{q:"What are the ratio and features of the late phase (90°–180°)?", opts:["1:1 ratio; the clavicle also moves actively to prevent joint impingement","2:1 ratio with no scapular movement","Only the humerus moves and the clavicle stays fixed","A preparation phase with almost no movement"]},
   a:0, ex:"후기(90~180°)는 위팔뼈 1도 : 어깨뼈 1도의 1:1 비율이며, 최대 가동범위를 위해 쇄골까지 적극적으로 움직여 관절 충돌을 막습니다."},
  {id:"q199", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬 후기에서 쇄골의 움직임으로 옳은 것은?", opts:["약 10° 상승, 40° 후방 회전","움직이지 않는다","약 40° 상승, 최소 10° 후방 회전","40° 하강, 10° 전방 회전"]},
   en:{q:"How does the clavicle move in the late phase of scapulohumeral rhythm?", opts:["About 10° of elevation and 40° of posterior rotation","It does not move","About 40° of elevation and at least 10° of posterior rotation","40° of depression and 10° of anterior rotation"]},
   a:2, ex:"후기에는 쇄골이 약 40° 상승하고 최소 10° 후방 회전합니다."},
  {id:"q200", part:"어깨위팔리듬",
   ko:{q:"어깨위팔뼈리듬의 세 단계를 팔 각도 순서대로 옳게 나열한 것은?", opts:["초기 0~90° → 중기 90~120° → 후기 120~180°","초기 0~10° → 중기 10~20° → 후기 20~180°","초기 0~30° → 중기 30~90° → 후기 90~180°","초기 90~180° → 중기 30~90° → 후기 0~30°"]},
   en:{q:"Which lists the three phases of scapulohumeral rhythm in order of arm angle?", opts:["Initial 0–90° → middle 90–120° → late 120–180°","Initial 0–10° → middle 10–20° → late 20–180°","Initial 0–30° → middle 30–90° → late 90–180°","Initial 90–180° → middle 30–90° → late 0–30°"]},
   a:2, ex:"초기(0~30°, 준비 단계, 위팔뼈 주도) → 중기(30~90°, 2:1) → 후기(90~180°, 1:1, 쇄골 적극 가담)."},
  {id:"q201", part:"어깨위팔리듬",
   ko:{q:"팔을 들 때 견갑골 상방회전 과정에서 중요한 기능을 하는 근육으로 옳은 것은?", opts:["승모근과 전거근","능형근과 견갑거근","광배근과 대원근","상완이두근과 삼두근"]},
   en:{q:"Which muscles are important during upward rotation of the scapula when raising the arm?", opts:["Trapezius and serratus anterior","Rhomboids and levator scapulae","Latissimus dorsi and teres major","Biceps and triceps"]},
   a:0, ex:"견갑골 상방회전 과정에서는 승모근과 전거근의 기능이 중요합니다."},
  {id:"q202", part:"S.T.J 움직임",
   ko:{q:"견갑흉곽관절(S.T.J)에서 가능한 움직임 6가지로 옳은 것은?", opts:["굴곡, 신전, 외전, 내전, 내회전, 외회전","회내, 회외, 굴곡, 신전, 요측편위, 척측편위","상승, 하강, 굴곡, 신전, 내회전, 외회전","상승, 하강, 후인, 전인, 상방회전, 하방회전"]},
   en:{q:"Which are the six movements possible at the scapulothoracic joint (S.T.J)?", opts:["Flexion, extension, abduction, adduction, internal rotation, external rotation","Pronation, supination, flexion, extension, radial deviation, ulnar deviation","Elevation, depression, flexion, extension, internal rotation, external rotation","Elevation, depression, retraction, protraction, upward rotation, downward rotation"]},
   a:3, ex:"S.T.J의 움직임: 상승, 하강, 후인, 전인, 상방회전, 하방회전."},
  {id:"q203", part:"S.T.J 움직임",
   ko:{q:"S.T.J 상승(elevation)에 작용하는 근육으로 옳은 것은?", opts:["하부 승모근(lower trapezius), 소흉근(pectoralis minor), 전거근(serratus anterior) (lower)","상부 승모근(upper trapezius), 견갑거근(levator scapulae), 능형근(rhomboids)","중부 승모근(middle trapezius), 능형근(rhomboids)","소흉근(pectoralis minor), 전거근(serratus anterior)"]},
   en:{q:"Which muscles act in elevation at the S.T.J?", opts:["Trapezius (lower fibers), Pectoralis minor, Serratus anterior (lower)","Trapezius (upper fibers), Levator scapulae, Rhomboids","Middle trapezius, Rhomboids","Pectoralis minor, Serratus anterior"]},
   a:1, ex:"상승: Trapezius(upper fibers), Levator scapula, Rhomboids."},
  {id:"q204", part:"S.T.J 움직임",
   ko:{q:"S.T.J 하강(depression)에 작용하는 근육으로 옳은 것은?", opts:["상부 승모근(upper trapezius), 견갑거근(levator scapulae), 능형근(rhomboids)","하부 승모근(lower trapezius), 소흉근(pectoralis minor), 전거근 하부 섬유(serratus anterior, lower)","중부 승모근(middle trapezius), 능형근(rhomboids)","극상근(supraspinatus), 극하근(infraspinatus)"]},
   en:{q:"Which muscles act in depression at the S.T.J?", opts:["Trapezius (upper fibers), Levator scapulae, Rhomboids","Trapezius (lower fibers), Pectoralis minor, Serratus anterior (lower fibers)","Middle trapezius, Rhomboids","Supraspinatus, Infraspinatus"]},
   a:1, ex:"하강: 하부 승모근(핵심), 소흉근, 전거근(하부 섬유) / 간접: 광배근, 쇄골하근. 능형근·견갑거근은 상승 근육입니다."},
  {id:"q205", part:"S.T.J 움직임",
   ko:{q:"S.T.J 하강에 간접적으로 관여하는 근육은?", opts:["견갑거근(levator scapulae), 능형근(rhomboids)","삼각근(deltoid), 상완이두근(biceps brachii)","소원근(teres minor), 극하근(infraspinatus)","광배근(latissimus dorsi), 쇄골하근(subclavius)"]},
   en:{q:"Which muscles contribute indirectly to scapular depression at the S.T.J?", opts:["Levator scapulae, Rhomboids","Deltoid, Biceps brachii","Teres minor, Infraspinatus","Latissimus dorsi, Subclavius"]},
   a:3, ex:"하강에는 광배근과 쇄골하근이 간접적으로 관여합니다."},
  {id:"q206", part:"S.T.J 움직임",
   ko:{q:"S.T.J 후인(retraction)에 작용하는 근육으로 옳은 것은?", opts:["중부 승모근(middle trapezius), 능형근(rhomboids)","하부 승모근(lower trapezius), 소흉근(pectoralis minor), 전거근(serratus anterior)","소흉근(pectoralis minor), 전거근(serratus anterior)","견갑거근(levator scapulae), 소흉근(pectoralis minor)"]},
   en:{q:"Which muscles act in retraction at the S.T.J?", opts:["Middle trapezius, Rhomboids","Trapezius (lower fibers), Pectoralis minor, Serratus anterior","Pectoralis minor, Serratus anterior","Levator scapulae, Pectoralis minor"]},
   a:0, ex:"후인: Middle trapezius, Rhomboids (강의 영상에서 수정된 내용)."},
  {id:"q207", part:"S.T.J 움직임",
   ko:{q:"S.T.J 전인(protraction)에 작용하는 근육으로 옳은 것은?", opts:["중부 승모근(middle trapezius), 능형근(rhomboids)","상부 승모근(upper trapezius), 견갑거근(levator scapulae)","소흉근(pectoralis minor), 전거근(serratus anterior)","광배근(latissimus dorsi), 쇄골하근(subclavius)"]},
   en:{q:"Which muscles act in protraction at the S.T.J?", opts:["Middle trapezius, Rhomboids","Upper trapezius, Levator scapulae","Pectoralis minor, Serratus anterior","Latissimus dorsi, Subclavius"]},
   a:2, ex:"전인: Pectoralis minor, Serratus anterior."},
  {id:"q208", part:"S.T.J 움직임",
   ko:{q:"S.T.J 상방회전(upward rotation)에 작용하는 근육으로 옳은 것은?", opts:["견갑거근(levator scapulae), 소흉근(pectoralis minor), 능형근(rhomboids)","중부 승모근만(middle trapezius only)","상부·하부 승모근(upper & lower trapezius), 전거근(serratus anterior)","극상근(supraspinatus), 삼각근(deltoid)"]},
   en:{q:"Which muscles act in upward rotation at the S.T.J?", opts:["Levator scapulae, Pectoralis minor, Rhomboids","Middle trapezius only","Upper & Lower trapezius, Serratus anterior","Supraspinatus, Deltoid"]},
   a:2, ex:"상방회전: Upper & Lower trapezius, Serratus anterior → 짝힘 (강의 영상에서 수정된 내용)."},
  {id:"q209", part:"S.T.J 움직임",
   ko:{q:"S.T.J 하방회전(downward rotation)에 작용하는 근육으로 옳은 것은?", opts:["견갑거근(levator scapulae), 소흉근(pectoralis minor), 능형근(rhomboids)","상부·하부 승모근(upper & lower trapezius), 전거근(serratus anterior)","중부 승모근(middle trapezius), 전거근(serratus anterior)","광배근(latissimus dorsi), 쇄골하근(subclavius)"]},
   en:{q:"Which muscles act in downward rotation at the S.T.J?", opts:["Levator scapulae, Pectoralis minor, Rhomboids","Upper & Lower trapezius, Serratus anterior","Middle trapezius, Serratus anterior","Latissimus dorsi, Subclavius"]},
   a:0, ex:"하방회전: Levator scapula, Pectoralis minor, Rhomboids → 짝힘."},
  {id:"q210", part:"S.T.J 움직임",
   ko:{q:"S.T.J에서 짝힘으로 정리된 두 움직임은?", opts:["상승과 하강","전인과 후인","상승과 후인","상방회전과 하방회전"]},
   en:{q:"Which two S.T.J movements are summarized as force couples?", opts:["Elevation and depression","Protraction and retraction","Elevation and retraction","Upward rotation and downward rotation"]},
   a:3, ex:"상방회전(승모근 상부·하부 + 전거근)과 하방회전(견갑거근 + 소흉근 + 능형근)이 짝힘입니다."},
  {id:"q211", part:"G.H.J 움직임",

function displayOf(q, level){
  if(level==="ko") return {qText:q.ko.q, opts:q.ko.opts};
  if(level==="mid") return {qText:q.ko.q, opts:q.en.opts};
  return {qText:q.en.q, opts:q.en.opts};
}

/* ================= 저장소 =================
   attempts[qid] = { ko:{wrong,correct,streak}, mid:{...}, en:{...} }
   난이도(하/중/상)별로 기록을 분리 보관한다 — '하'에서 쌓은 정답률이 '중/상'에 섞이지 않는다.
   SCHEMA_VERSION을 올리고 migrate()에 변환 규칙을 추가하면,
   이후 구조가 바뀌어도 기존 저장 데이터를 지우지 않고 이어서 쓸 수 있다. */
const STORE_KEY = "anat_progress"; // 이 키는 앞으로 바꾸지 않는다 — 구조 변경은 migrate()로 흡수
const SCHEMA_VERSION = 2;
const DEFAULTS = { attempts:{}, favorites:[], todayDate:"", todayCount:0, level:"ko", schemaVersion:SCHEMA_VERSION };
let progress = JSON.parse(JSON.stringify(DEFAULTS));

function emptyLevelRec(){ return {wrong:0, correct:0, streak:0}; }

/* 예전 버전 데이터를 최신 구조로 변환한다. 모르는 필드는 버리지 않고 최대한 옮겨 담는다. */
function migrate(data){
  const fromVersion = data.schemaVersion || 1;
  if(fromVersion < 2){
    // v1: attempts[qid] = {wrong, correct, streak} (난이도 구분 없이 하나로 기록됨)
    // → 기존 기록은 '하' 난이도에서 쌓인 것으로 간주해 ko 버킷으로 이전한다.
    const migratedAttempts = {};
    Object.keys(data.attempts || {}).forEach(qid=>{
      const old = data.attempts[qid];
      if(old && (old.ko || old.mid || old.en)){
        migratedAttempts[qid] = { ko: old.ko||emptyLevelRec(), mid: old.mid||emptyLevelRec(), en: old.en||emptyLevelRec() };
      } else if(old){
        migratedAttempts[qid] = {
          ko: {wrong: old.wrong||0, correct: old.correct||0, streak: old.streak||0},
          mid: emptyLevelRec(), en: emptyLevelRec(),
        };
      }
    });
    data.attempts = migratedAttempts;
  }
  data.schemaVersion = SCHEMA_VERSION;
  return data;
}

/* GitHub Pages 등 일반 웹 호스팅에서 동작하도록 localStorage를 사용한다.
   기기(브라우저) 단위로 개인 기록이 저장되며, 계정 간 동기화는 되지 않는다. */
async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = migrate(JSON.parse(raw));
      progress = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), parsed);
    }
  }catch(e){ /* 최초 사용 또는 localStorage 접근 불가: 저장된 값 없음 */ }
  const today = new Date().toISOString().slice(0,10);
  if(progress.todayDate !== today){ progress.todayDate = today; progress.todayCount = 0; }
}
async function saveProgress(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error("저장 실패", e); }
}

function rec(qid, level){
  if(!progress.attempts[qid]) progress.attempts[qid] = { ko:emptyLevelRec(), mid:emptyLevelRec(), en:emptyLevelRec() };
  if(!progress.attempts[qid][level]) progress.attempts[qid][level] = emptyLevelRec();
  return progress.attempts[qid][level];
}
function markAttempt(qid, correct){
  const r = rec(qid, progress.level);
  if(correct){ r.correct++; r.streak++; }
  else { r.wrong++; r.streak = 0; }
  progress.todayCount++;
}
function toggleFavorite(qid){
  const i = progress.favorites.indexOf(qid);
  if(i>-1) progress.favorites.splice(i,1); else progress.favorites.push(qid);
}
/* 현재 선택된 난이도 기준으로, 한 번이라도 틀렸고 아직 연속 정답 2회를 못 채운 문항만 오답노트에 남는다 */
function wrongIds(level){
  level = level || progress.level;
  return Object.keys(progress.attempts).filter(id=>{
    const byLevel = progress.attempts[id];
    const r = byLevel && byLevel[level];
    if(!r || r.wrong === 0) return false;
    return (r.streak || 0) < GRADUATE_STREAK;
  });
}
/* 현재 선택된 난이도 기준의 파트별 정답률 */
function partStats(level){
  level = level || progress.level;
  return PARTS.map(p=>{
    const qs = QUESTIONS.filter(q=>q.part===p);
    let c=0, w=0;
    qs.forEach(q=>{
      const byLevel = progress.attempts[q.id];
      const r = byLevel && byLevel[level];
      if(r){ c+=r.correct; w+=r.wrong; }
    });
    const total = c+w;
    return { part:p, correct:c, wrong:w, total, pct: total? Math.round(c/total*100) : null };
  });
}
function accColor(pct){
  if(pct===null) return "var(--line)";
  if(pct>=80) return "var(--good)";
  if(pct>=60) return "var(--warn)";
  return "var(--bad)";
}

/* ================= 유틸 ================= */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function byIds(ids){ return QUESTIONS.filter(q=>ids.includes(q.id)); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= 퀴즈 엔진 ================= */
let quizState = null;

function startQuiz(list, opts){
  if(list.length===0){ showToast("풀 수 있는 문항이 없습니다."); return; }
  // 문항마다 선택지 순서를 섞은 인덱스 배열을 미리 만들어 둔다(같은 문항 내에서는 고정)
  const orders = {};
  list.forEach(q=>{ orders[q.id] = shuffle([0,1,2,3].slice(0, q.ko.opts.length)); });

  quizState = {
    list, orders, idx:0, answers:{},
    mode: opts.mode || "practice",
    title: opts.title || "문제 풀이",
    timeLimit: opts.timeLimit || null,
    remaining: opts.timeLimit || null,
    timer: null,
  };
  if(quizState.timeLimit){
    quizState.timer = setInterval(()=>{
      quizState.remaining--;
      const t = document.getElementById('qTimer');
      if(t) t.textContent = fmtTime(quizState.remaining);
      if(quizState.remaining<=0){ clearInterval(quizState.timer); submitExam(); }
    },1000);
  }
  renderQuiz();
}
function fmtTime(s){
  const m=Math.floor(s/60), sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderQuiz(){
  const {list, idx, mode, title, orders} = quizState;
  const q = list[idx];
  const level = progress.level;
  const {qText, opts} = displayOf(q, level);
  const order = orders[q.id];              // 화면 위치 → 원본 선택지 인덱스
  const isFav = progress.favorites.includes(q.id);
  const chosen = quizState.answers[q.id];  // 원본 인덱스로 저장
  const answered = chosen !== undefined;
  const r = progress.attempts[q.id] && progress.attempts[q.id][level];
  const inWrongNote = r && r.wrong>0 && (r.streak||0) < GRADUATE_STREAK;

  main.innerHTML = `
    <div class="top-bar">
      <div class="back-btn" id="quitBtn">✕</div>
      <h2>${title}</h2>
      ${quizState.timeLimit ? `<span class="quiz-timer" id="qTimer" style="margin-left:auto;">${fmtTime(quizState.remaining)}</span>` : ''}
    </div>
    <div class="quiz-progress"><span>${idx+1} / ${list.length}</span><span>${q.part}</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${((idx+1)/list.length*100).toFixed(0)}%"></div></div>
    <div class="q-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div>
          <span class="q-part-tag">${q.part}</span>
          <span class="q-level-tag ${level}">${LEVELS.find(l=>l.id===level).label}</span>
          ${inWrongNote ? `<span class="q-streak-tag">연속 ${r.streak||0}/${GRADUATE_STREAK}</span>` : ``}
        </div>
        <button class="star-btn" id="favBtn">${isFav ? '⭐' : '☆'}</button>
      </div>
      <p class="q-text">${qText}</p>
      <div class="choice-list" id="choiceList"></div>
      <div id="explainWrap"></div>
    </div>
  `;
  document.getElementById('quitBtn').onclick = ()=>{
    if(quizState.timer) clearInterval(quizState.timer);
    currentTab="home"; render();
  };
  document.getElementById('favBtn').onclick = ()=>{ toggleFavorite(q.id); saveProgress(); renderQuiz(); };

  const cl = document.getElementById('choiceList');
  order.forEach(origIdx=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = opts[origIdx];
    if(mode==="practice" && answered){
      if(origIdx===q.a) b.classList.add('correct');
      else if(origIdx===chosen) b.classList.add('wrong');
    } else if(mode==="exam" && chosen===origIdx){
      b.classList.add('selected');
    }
    b.onclick = ()=> selectAnswer(origIdx);
    cl.appendChild(b);
  });

  if(mode==="practice" && answered){
    const ok = chosen===q.a;
    const rr = progress.attempts[q.id][level];
    const streakMsg = ok
      ? ((rr.streak||0) >= GRADUATE_STREAK
          ? `연속 ${GRADUATE_STREAK}회 정답 — 오답노트에서 졸업했습니다.`
          : (rr.wrong>0 ? `연속 정답 ${rr.streak}/${GRADUATE_STREAK} — 한 번 더 맞히면 오답노트에서 사라집니다.` : ``))
      : `연속 정답 기록이 0으로 초기화됐습니다.`;
    document.getElementById('explainWrap').innerHTML = `
      <div class="explain-box"><b>해설</b><br>${q.ex}${streakMsg ? `<br><br>${streakMsg}` : ``}</div>`;
  }
  renderQuizFooter();
}

function selectAnswer(origIdx){
  const q = quizState.list[quizState.idx];
  if(quizState.mode==="practice" && quizState.answers[q.id]!==undefined) return;
  quizState.answers[q.id] = origIdx;
  if(quizState.mode==="practice"){
    markAttempt(q.id, origIdx===q.a);
    saveProgress();
  }
  renderQuiz();
}

function renderQuizFooter(){
  const {list, idx, mode} = quizState;
  const q = list[idx];
  const answered = quizState.answers[q.id] !== undefined;
  const footer = document.createElement('div');
  footer.style.display='flex'; footer.style.gap='8px'; footer.style.marginTop='4px';

  if(mode==="exam"){
    const prev = document.createElement('button');
    prev.className='secondary-btn'; prev.style.flex='1'; prev.textContent='이전';
    prev.disabled = idx===0;
    prev.onclick = ()=>{ quizState.idx--; renderQuiz(); };
    footer.appendChild(prev);

    const next = document.createElement('button');
    next.className='primary-btn'; next.style.flex='1'; next.style.marginTop='0';
    next.textContent = idx===list.length-1 ? '제출' : '다음';
    next.onclick = ()=>{ if(idx===list.length-1) submitExam(); else { quizState.idx++; renderQuiz(); } };
    footer.appendChild(next);
  } else {
    const next = document.createElement('button');
    next.className='primary-btn'; next.style.flex='1';
    next.disabled = !answered;
    next.textContent = idx===list.length-1 ? '결과 보기' : '다음 문제';
    next.onclick = ()=>{ if(idx===list.length-1) finishPractice(); else { quizState.idx++; renderQuiz(); } };
    footer.appendChild(next);
  }
  main.appendChild(footer);
}

function finishPractice(){
  const {list, answers, title} = quizState;
  let correct=0;
  list.forEach(q=>{ if(answers[q.id]===q.a) correct++; });
  renderResult(correct, list.length, title, false);
}
function submitExam(){
  if(quizState.timer) clearInterval(quizState.timer);
  const {list, answers, title} = quizState;
  let correct=0;
  list.forEach(q=>{
    const ok = answers[q.id]===q.a;
    if(ok) correct++;
    markAttempt(q.id, ok);
  });
  saveProgress();
  renderResult(correct, list.length, title, true);
}

function renderResult(correct, total, title, isExam){
  const pct = Math.round(correct/total*100);
  const pass = pct>=60;
  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>${title} 결과</h2></div>
    <div class="q-card result-hero">
      <div class="result-score">${correct} / ${total}</div>
      <div class="result-sub">정답률 ${pct}%</div>
      ${isExam ? `<div class="pass-badge ${pass?'pass':'fail'}">${pass?'합격 (60점 이상)':'불합격 (60점 미만)'}</div>` : ''}
    </div>
    <button class="primary-btn" id="toHome">홈으로</button>
    <button class="secondary-btn" id="toWrong">오답노트 보기</button>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };
  document.getElementById('toHome').onclick = ()=>{ currentTab="home"; render(); };
  document.getElementById('toWrong').onclick = ()=>{ currentTab="wrong"; render(); };
}

  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>뼈 이름 라벨링 연습</h2></div>
    <div class="level-note">부위를 고르면 실제 강의자료 그림이 뜨고, 번호가 매겨진 위치마다 신용어·구용어·영어를 채워넣습니다. (이번 기능은 세션 동안만 채점 기록이 유지됩니다)</div>
    <div class="section-title">부위 선택</div>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };
  LABEL_PARTS.forEach(part=>{
    const item = document.createElement('div');
    item.className = 'menu-item';
    item.innerHTML = `
      <div class="ic blue">${part.emoji}</div>
      <div class="body"><h3>${part.name}</h3><p>${part.bones.length}개 뼈</p></div>
      <div class="chev">›</div>`;
    item.onclick = ()=> renderLabelPractice(part.id);
    main.appendChild(item);
  });
}

function renderLabelPractice(partId, mode){
  mode = mode || 'fill';
  const part = LABEL_PARTS.find(p=>p.id===partId);

  main.innerHTML = `
    <div class="top-bar"><div class="back-btn" id="back">←</div><h2>${part.name} 라벨링</h2></div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <span class="part-chip" id="modeFillBtn" style="margin:0;">용어 채우기</span>
      <span class="part-chip" id="modeFindBtn" style="margin:0;">위치 찾기</span>
    </div>
    <div id="labelModeBody"></div>
  `;
  document.getElementById('back').onclick = ()=>{ currentTab="home"; render(); };
  const fillBtn = document.getElementById('modeFillBtn');
  const findBtn = document.getElementById('modeFindBtn');
  (mode==='fill' ? fillBtn : findBtn).classList.add('selected');
  fillBtn.onclick = ()=> renderLabelPractice(partId, 'fill');
  findBtn.onclick = ()=> renderLabelPractice(partId, 'find');

  const body = document.getElementById('labelModeBody');
  if(mode==='find') renderLabelFindMode(part, body);
  else renderLabelFillMode(part, body);
}

/* ----- 모드 1: 용어 채우기 (기존 기능) ----- */
function renderLabelFillMode(part, container){
  container.innerHTML = `
    <div id="labelImages"></div>
    <div class="section-title">그림 속 번호 — 용어 채우기</div>
    <div id="labelRows"></div>
    <button class="primary-btn" id="gradeBtn">채점하기</button>
    <div id="labelResultWrap"></div>
  `;

  const imgWrap = document.getElementById('labelImages');
  part.images.forEach(img=>{
    const card = document.createElement('div');
    card.className = 'q-card';
    card.style.marginBottom = '10px';
    card.style.position = 'relative';
    card.style.padding = '0';
    card.style.overflow = 'hidden';
    card.innerHTML = `
      <div style="position:relative;width:100%;line-height:0;">
        <img src="${img.src}" style="width:100%;display:block;" alt="뼈 그림">
        ${img.markers.map(m=>`
          <div style="position:absolute;left:${m.x}%;top:${m.y}%;transform:translate(-50%,-50%);
                      width:26px;height:26px;border-radius:50%;background:var(--accent-deep);
                      color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
                      box-shadow:0 0 0 2px #fff;">${m.num}</div>
        `).join("")}
      </div>
    `;
    imgWrap.appendChild(card);
  });

  function buildRow(b){
    const row = document.createElement('div');
    row.className = 'q-card';
    row.style.marginBottom = '10px';
    row.innerHTML = `
      <div style="font-weight:700;font-size:14px;margin-bottom:8px;">
        ${b.num}번 ${b.note ? `<span style="font-weight:400;color:var(--text-soft);font-size:12px;">(${b.note})</span>` : ``}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <label style="font-size:11px;color:var(--text-soft);">
          신용어
          <input type="text" placeholder="예: 위팔뼈" data-bone="${b.num}" data-field="ko" class="choice-btn" style="padding:10px;width:100%;box-sizing:border-box;margin-top:2px;">
        </label>
        ${b.hanja ? `<label style="font-size:11px;color:var(--text-soft);">
          구용어
          <input type="text" placeholder="예: 상완골" data-bone="${b.num}" data-field="hanja" class="choice-btn" style="padding:10px;width:100%;box-sizing:border-box;margin-top:2px;">
        </label>` : ``}
        <label style="font-size:11px;color:var(--text-soft);">
          English
          <input type="text" placeholder="e.g. humerus" data-bone="${b.num}" data-field="en" class="choice-btn" style="padding:10px;width:100%;box-sizing:border-box;margin-top:2px;">
        </label>
      </div>
      ${!b.hanja ? `<div class="acc-sub" style="margin-top:4px;">구용어는 자료에 없어 생략했습니다.</div>` : ``}
      <div id="labelFeedback-${b.num}"></div>
    `;
    return row;
  }
  const rowsWrap = document.getElementById('labelRows');
  part.bones.forEach(b=> rowsWrap.appendChild(buildRow(b)));

  function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g,""); }
  function checkField(input, correct){
    const ok = norm(input.value) === norm(correct);
    input.classList.remove('correct','wrong');
    input.classList.add(ok ? 'correct' : 'wrong');
    return ok;
  }

  document.getElementById('gradeBtn').onclick = ()=>{
    let total = 0, correct = 0;
    part.bones.forEach(b=>{
      const koInput = document.querySelector(`input[data-bone="${b.num}"][data-field="ko"]`);
      const enInput = document.querySelector(`input[data-bone="${b.num}"][data-field="en"]`);
      const okKo = checkField(koInput, b.ko);
      const okEn = checkField(enInput, b.en);
      let okHanja = true;
      if(b.hanja){
        const hanjaInput = document.querySelector(`input[data-bone="${b.num}"][data-field="hanja"]`);
        okHanja = checkField(hanjaInput, b.hanja);
        total += 1; correct += okHanja ? 1 : 0;
      }
      total += 2; correct += (okKo?1:0)+(okEn?1:0);
      const fb = document.getElementById(`labelFeedback-${b.num}`);
      if(!(okKo && okHanja && okEn)){
        fb.innerHTML = `<div class="explain-box" style="margin-top:8px;"><b>정답</b><br>${b.ko}${b.hanja ? ` · ${b.hanja}` : ``} · ${b.en}</div>`;
      } else {
        fb.innerHTML = "";
      }
    });
    const pct = Math.round(correct/total*100);
    document.getElementById('labelResultWrap').innerHTML = `
      <div class="q-card result-hero" style="margin-top:14px;">
        <div class="result-score">${correct} / ${total}</div>
        <div class="result-sub">정답률 ${pct}% — 틀린 칸은 빨간색, 아래에 정답 표시</div>
      </div>`;
  };
}

/* ----- 모드 2: 위치 찾기 (그림에서 직접 클릭해서 위치 맞히기) ----- */
function renderLabelFindMode(part, container){
  const order = shuffle(part.bones.map(b=>b.num));
  let idx = 0;
  let correctCount = 0;
  let locked = false;

  function currentBone(){ return part.bones.find(b=>b.num===order[idx]); }
  function findImageAndMarker(num){
    for(const img of part.images){
      const m = img.markers.find(mk=>mk.num===num);
      if(m) return { img, marker: m };
    }
    return null;
  }

  function renderQuestion(){
    locked = false;
    const b = currentBone();
    container.innerHTML = `
      <div class="quiz-progress"><span>${idx+1} / ${order.length}</span><span>${part.name}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${((idx+1)/order.length*100).toFixed(0)}%"></div></div>
      <div class="q-card" style="margin-bottom:12px;">
        <span class="q-part-tag">위치 찾기</span>
        <p class="q-text">
          ${b.ko}${b.hanja ? `(${b.hanja}, ${b.en})` : `(${b.en})`}은 어디에 있을까요?
        </p>
        ${b.note ? `<div class="acc-sub">${b.note}</div>` : ``}
        <div class="acc-sub" style="margin-top:6px;">그림 위를 눌러서 위치를 찍어보세요.</div>
      </div>
      <div id="findImages"></div>
      <div id="findFeedback"></div>
      <button class="primary-btn" id="findNextBtn" style="display:none;">다음</button>
    `;
    const wrap = document.getElementById('findImages');
    part.images.forEach((img, i)=>{
      const card = document.createElement('div');
      card.className = 'q-card';
      card.style.marginBottom = '10px';
      card.style.position = 'relative';
      card.style.padding = '0';
      card.style.overflow = 'hidden';
      card.innerHTML = `
        <div class="find-img-wrap" data-imgidx="${i}" style="position:relative;width:100%;line-height:0;cursor:pointer;">
          <img src="${img.src}" style="width:100%;display:block;" alt="뼈 그림" draggable="false">
        </div>
      `;
      wrap.appendChild(card);
    });
    // 클릭 핸들러는 DOM에 다 붙인 뒤 한번에 연결 (인덱스와 요소를 정확히 매칭)
    const wrapEls = wrap.querySelectorAll('.find-img-wrap');
    wrapEls.forEach((wrapEl, i)=>{
      wrapEl.onclick = (e)=>{
        if(locked) return;
        const rect = wrapEl.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * 100;
        const clickY = ((e.clientY - rect.top) / rect.height) * 100;
        handleAnswer(i, clickX, clickY, wrapEl, wrapEls);
      };
    });
  }

  function markerDot(x, y, bg, label){
    return `<div style="position:absolute;left:${x}%;top:${y}%;transform:translate(-50%,-50%);
                width:28px;height:28px;border-radius:50%;background:${bg};color:#fff;
                display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
                box-shadow:0 0 0 2px #fff;pointer-events:none;">${label}</div>`;
  }

  function handleAnswer(clickedImgIdx, clickX, clickY, clickedWrapEl, allWrapEls){
    locked = true;
    const b = currentBone();
    const target = findImageAndMarker(b.num);
    const targetImgIdx = part.images.indexOf(target.img);

    let ok = false;
    if(clickedImgIdx === targetImgIdx){
      const dx = clickX - target.marker.x;
      const dy = clickY - target.marker.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      ok = (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) || dist <= 8;
    }
    if(ok) correctCount++;

    clickedWrapEl.insertAdjacentHTML('beforeend', markerDot(clickX, clickY, ok ? 'var(--good)' : 'var(--bad)', ok ? '✓' : '✕'));
    if(!ok){
      const targetWrapEl = allWrapEls[targetImgIdx];
      targetWrapEl.insertAdjacentHTML('beforeend', markerDot(target.marker.x, target.marker.y, 'var(--good)', '★'));
    }

    document.getElementById('findFeedback').innerHTML = `
      <div class="explain-box" style="margin-top:4px;">
        <b>${ok ? '정답입니다!' : '아쉬워요'}</b><br>
        ${b.ko}${b.hanja ? ` · ${b.hanja}` : ``} · ${b.en}
      </div>`;

    const nextBtn = document.getElementById('findNextBtn');
    nextBtn.style.display = 'block';
    nextBtn.textContent = (idx === order.length - 1) ? '결과 보기' : '다음';
    nextBtn.onclick = ()=>{
      if(idx === order.length - 1) renderFindResult();
      else { idx++; renderQuestion(); }
    };
  }

  function renderFindResult(){
    const pct = Math.round(correctCount / order.length * 100);
    container.innerHTML = `
      <div class="q-card result-hero">
        <div class="result-score">${correctCount} / ${order.length}</div>
        <div class="result-sub">정답률 ${pct}%</div>
      </div>
      <button class="primary-btn" id="findRetryBtn">다시 풀기</button>
    `;
    document.getElementById('findRetryBtn').onclick = ()=> renderLabelPractice(part.id, 'find');
  }

  renderQuestion();
}

/* ================= 초기 실행 ================= */
(async function init(){
  await loadProgress();
  render();
})();
</script>
